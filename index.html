);letter-spacing:-.04em;line-height:1.18;margin:9px 0 13px}h2{font-size:23px;letter-spacing:-.035em;margin:0 0 7px}h3{font-size:17px;letter-spacing:-.025em;margin:0 0 7px}p{margin:0 0 14px}.muted{color:var(--muted)}.lead{max-width:730px;color:#625269;font-size:16px}.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,.85fr);gap:20px;margin-bottom:29px}.card{background:var(--surface);border:1px solid #E6DDED;border-radius:20px;padding:24px;box-shadow:var(--shadow)}.hero-main{padding:32px;background:linear-gradient(125deg,#F9F5FC,#F1E7F4)}.hero-side{background:#E1D0E9;display:flex;flex-direction:column;justify-content:space-between}.hero-side .number{font-size:44px;line-height:1.1;font-weight:850;letter-spacing:-.05em;color:var(--accent-dark)}.btn{border:0;border-radius:11px;background:var(--accent);padding:12px 17px;color:white;font-weight:750;display:inline-flex;justify-content:center;align-items:center;gap:8px}.btn:hover{background:var(--accent-dark)}.btn.secondary{background:#E7D9ED;color:var(--accent-dark)}.btn.secondary:hover{background:#DCC4E6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:174px}.tile .ico{font-size:23px;background:#EEE1F3;border-radius:12px;width:44px;height:44px;display:grid;place-items:center}.tile p{font-size:13px;color:var(--muted);margin:0}.tile .go{color:var(--accent-dark);font-size:13px;font-weight:800;margin-top:auto;background:none;border:0;padding:5px 0}.section-heading{margin:28px 0 17px}.hide{display:none!important}.detail{max-width:870px}.list{display:grid;gap:13px}.lesson-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px}.mini{font-size:12px;font-weight:750;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;border-radius:50px;padding:5px 10px;background:#EDDFEF;color:var(--accent-dark);font-size:12px;font-weight:700}.article{font-size:15px;line-height:1.8}.article h3{margin-top:18px}.article ul{padding-left:22px}.article li{margin-bottom:8px}.response{border-left:4px solid var(--accent);padding:12px 15px;background:#F0E7F4;border-radius:0 10px 10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.search{display:block;width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--ink);margin:20px 0}textarea.search{resize:vertical;min-height:120px} .btn:disabled{opacity:.48;cursor:not-allowed}.option{display:block;text-align:left;width:100%;border:1px solid var(--border);border-radius:12px;padding:15px;background:#fff;color:var(--ink);margin-top:11px}.option:hover{border-color:var(--accent)}.option.chosen{border:2px solid var(--accent);background:#F0E7F4}.feedback{background:#E9DDEE;border-radius:13px;padding:17px;margin-top:17px}.mobile-head{display:none}.notice{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;margin-top:25px}@media(max-width:850px){.app{display:block}aside{display:none}.mobile-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;z-index:5;top:0;background:#F3ECF7;padding:12px 18px;border-bottom:1px solid var(--border)}.mobile-head .brand{padding:0}.mobile-head .brand-mark{width:35px;height:35px}.mobile-head .brand-name{font-size:11px}.mobile-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:10px 15px;background:#F3ECF7;border-bottom:1px solid var(--border)}.mobile-menu .nav{font-size:12px;padding:9px}main{padding:22px 18px 50px}.top{margin-bottom:20px}.hero{grid-template-columns:1fr}.hero-main{padding:25px}.hero-side{min-height:125px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px}.tile{min-height:185px}.tile .ico{width:38px;height:38px}.lesson-card{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.tile{min-height:142px}.top .tag{display:none}}@media(prefers-redu <script>
const nav=[["home","⌂","Overview"],["learn","◫","Short Lessons"],["patterns","◇","Recognize Patterns"],["practice","▤","Conversation Lab"],["guide","☷","Quick Response Guide"],["journal","✎","Reflection Journal"]];
const lessons=[
{title:"Traits aren't diagnoses",category:"Understand behavior",time:"5 min",body:"Narcissistic traits can include entitlement, sensitivity to criticism, and a strong need for admiration. A personality disorder is a clinical diagnosis that requires a qualified professional. One argument, a defensive reply, or a few public posts cannot establish it.",take:"Describe the specific behavior you observed rather than labeling the person.",exercise:"Replace ‘They're a narcissist’ with a precise description of what happened."},
{title:"Recognizing blame-shifting",category:"Manipulation patterns",time:"6 min",body:"Blame-shifting moves attention away from the action being discussed and toward somebody else's alleged wrongdoing. It can be deliberate, but it can also occur defensively. Look for a recurring pattern, the context, and the person's willingness to return to the original issue.",take:"Acknowledge relevant concerns, then return to the original question.",exercise:"Practice: ‘We can discuss my part too. First, can we clarify what happened yesterday?’"},
{title:"Gaslighting versus disagreement",category:"Manipulation patterns",time:"6 min",body:"Gaslighting generally refers to a pattern of undermining someone's confidence in their perception of reality. Ordinary disagreement, a sincere memory error, or a different interpretation is not automatically gaslighting. Keep contemporary notes and check what independent evidence is available.",take:"Verify facts rather than escalating debates over memory.",exercise:"List two possible explanations for a contradiction before drawing conclusions."},
{title:"Asking questions that clarify",category:"Truth & evidence",time:"7 min",body:"Start with neutral, open-ended questions. Ask the person to walk through the sequence, then clarify details. Avoid leading questions and aggressive accusations. A contradiction may reflect confusion, memory limits, or dishonesty; it is not proof by itself.",take:"Gather information before evaluating explanations.",exercise:"Write three open-ended follow-up questions for an inconsistent timeline."},
{title:"Boundaries without retaliation",category:"Response skills",time:"5 min",body:"A boundary states what you will or will not participate in, along with a consequence under your control. It is not a threat to make someone behave differently. If a conversation becomes unsafe or abusive, focus on distance and support rather than winning the exchange.",take:"Use ‘I will…’ language rather than threats or humiliation.",exercise:"Practice: ‘If we start insulting each other, I'll end this conversation and return later.’"},
{title:"Persuasion without pressure",category:"Influence",time:"6 min",body:"Ethical persuasion explains your reasoning, considers the other person's perspective, and leaves them free to disagree. Psychological exploitation uses vulnerabilities, shame, fear, or coercion to force a decision. Being firm and persuasive does not require gaining control over somebody else.",take:"Make clear requests and invite an informed choice.",exercise:"Turn a guilt-based demand into a respectful proposal."}
];
const patterns=[{"name":"Blame-shifting","category":"Conflict tactics","sign":"The original concern is redirected to alleged faults of the person raising it.","example":"You ask about an unkept agreement; the reply becomes a list of your unrelated mistakes.","response":"‘I can discuss my part too. Can we first finish this specific issue?’","note":"A defensive change of subject can be unintentional. Look for repeated patterns and context.","next":"Keep separate notes of each issue; handle them one at a time."},{"name":"Guilt-tripping","category":"Pressure tactics","sign":"Affection, loyalty, or morality is framed as requiring agreement.","example":"‘If you really cared about me, you'd do this immediately.’","response":"‘I care about you, and I still need to make my own decision.’","note":"Someone expressing genuine hurt is not automatically manipulating you.","next":"Consider the request on its merits, not solely on the fear of disappointing someone."},{"name":"DARVO","category":"Conflict tactics","sign":"Denial, attack, and reversal of victim and offender roles occur in a dispute.","example":"After a concern is raised, the discussion centers exclusively on how unfair it was to raise it.","response":"‘Let's return to what happened and examine each concern separately.’","note":"This framework is not a test of truthfulness or a diagnosis.","next":"Record factual claims and responses separately, without inferring guilt from the pattern."},{"name":"Gaslighting","category":"Reality & evidence","sign":"A repeated pattern of undermining another person's confidence in their memory or perception.","example":"Repeatedly denying documented events while insisting the other person cannot trust their own recollection.","response":"‘We disagree about this. I'm going to review the information available.’","note":"One disagreement, forgetfulness, or misunderstanding does not establish gaslighting.","next":"Seek neutral records and support if the pattern affects your well-being."},{"name":"Moving goalposts","category":"Pressure tactics","sign":"The standard for success keeps changing after prior requirements are satisfied.","example":"After you complete an agreed task, an unmentioned requirement is added repeatedly.","response":"‘What specific outcome are we agreeing to, and can we write it down?’","note":"Expectations can change for legitimate reasons; examine the explanation.","next":"Clarify scope and criteria before committing more time."},{"name":"Provocation","category":"Conflict tactics","sign":"Personal insults or bait draw attention away from the underlying issue.","example":"A discussion of scheduling turns into insults about intelligence or character.","response":"‘I'm available to talk about the issue, not personal insults.’","note":"Frustration does not necessarily imply a deliberate manipulation strategy.","next":"Pause or disengage if the discussion becomes hostile."},{"name":"Love bombing","category":"Relationship patterns","sign":"Very intense attention or affection appears early, sometimes alongside pressure for rapid commitment.","example":"Someone you've just met pushes for immediate major promises and resents slowing down.","response":"‘I enjoy getting to know you, but I'm taking this at my own pace.’","note":"High enthusiasm alone is not evidence of abuse or manipulation.","next":"Look at whether boundaries are respected over time."},{"name":"Silent treatment versus taking space","category":"Relationship patterns","sign":"Unexplained withdrawal may be experienced as punitive, whereas a communicated break can be healthy.","example":"Someone disappears after every disagreement and refuses to say when discussion can resume.","response":"‘I respect needing space. Could we agree on when to check back in?’","note":"Silence can reflect overwhelm, safety needs, or many other factors.","next":"Avoid repeated unwanted contact; set your own expectations."},{"name":"Triangulation","category":"Relationship patterns","sign":"A third person's opinion or presence is used to apply pressure in a two-person dispute.","example":"‘Everyone agrees you're wrong,’ without identifying the specific concern.","response":"‘I'd prefer to discuss our disagreement directly and specifically.’","note":"Seeking mediation or outside support can be healthy.","next":"Do not recruit others into a retaliation cycle."},{"name":"Emotional blackmail","category":"Pressure tactics","sign":"Threats of withdrawal, punishment, or distress are used to demand compliance.","example":"‘If you don't do this, I'll ruin your reputation.’","response":"‘I won't make a decision under threats. I'm ending this conversation for now.’","note":"Some threats indicate serious safety risks, not merely poor communication.","next":"Preserve relevant evidence and seek qualified support if threatened."},{"name":"False urgency","category":"Pressure tactics","sign":"Artificial deadlines attempt to bypass consideration and verification.","example":"‘You have five minutes to decide or you lose everything.’","response":"‘I won't agree without enough time to review the facts.’","note":"Real deadlines exist; verify them independently.","next":"Use an agreed decision window or decline."},{"name":"Projection","category":"Thinking traps","sign":"A person attributes to someone else feelings or motives that may also be relevant to themselves.","example":"An argument repeatedly includes assumptions about your intent without evidence.","response":"‘What specific action are you referring to? Let's discuss that.’","note":"Projection is difficult to establish from outside; avoid mind-reading.","next":"Focus on observable conduct rather than assumed inner motives."},{"name":"Stonewalling","category":"Conflict tactics","sign":"A person disengages from conversation in a way that prevents resolution.","example":"Every attempt to agree on next steps ends without a response or plan.","response":"‘Let's pause and agree on a specific time to revisit this.’","note":"Withdrawal may be protective, especially during conflict or abuse.","next":"You cannot force engagement; decide what boundaries you need."},{"name":"Intermittent reinforcement","category":"Relationship patterns","sign":"Unpredictable rewarding and withholding may strengthen a difficult attachment.","example":"Warm reassurance is followed by unexplained withdrawal, repeated over time.","response":"‘I need consistency and clarity rather than unpredictable commitments.’","note":"Variability by itself does not establish malicious intent.","next":"Judge whether the overall relationship is reliable and safe."},{"name":"Minimization","category":"Reality & evidence","sign":"A harmful or consequential event is dismissed as insignificant.","example":"‘It was just a joke,’ after a repeated hurtful comment.","response":"‘Regardless of intent, I want to address the impact and what changes next.’","note":"People may sincerely perceive impact differently.","next":"Name the specific act and ask for concrete repair."},{"name":"Selective evidence","category":"Reality & evidence","sign":"Only supporting facts are presented while contrary information is ignored.","example":"A story cites one message but omits nearby messages that change its meaning.","response":"‘What information might challenge that interpretation?’","note":"Incomplete information can be accidental.","next":"Look for primary sources and missing context."},{"name":"Mind-reading claims","category":"Thinking traps","sign":"Someone asserts certainty about another person's intentions without evidence.","example":"‘I know you did that to humiliate me,’ despite no direct statement of intent.","response":"‘I hear that's how it felt. Can we discuss what happened and what I intended?’","note":"Feelings and interpretations are real experiences but not proof of intent.","next":"Distinguish an action, its impact, and any inferred motive."},{"name":"Boundary testing","category":"Relationship patterns","sign":"Someone repeatedly challenges a plainly communicated limit.","example":"A person keeps pressuring you after you've declined a nonessential request.","response":"‘I've answered. If the pressure continues, I'll end the discussion.’","note":"An initial misunderstanding is not the same as repeated disregard.","next":"Choose consequences you can safely carry out yourself."},{"name":"Narcissistic traits vs. NPD","category":"Personality & behavior","sign":"Traits such as entitlement or heightened sensitivity to criticism exist on a continuum; NPD is a clinical diagnosis.","example":"A person becomes defensive when criticized and frequently asks for admiration.","response":"‘Let's discuss the specific behavior and how it affects us.’","note":"Neither isolated incidents nor a short online checklist can diagnose a personality disorder.","next":"Do not use clinical labels to win arguments."},{"name":"Coercive control warning signs","category":"Safety & boundaries","sign":"A pattern of intimidation, isolation, monitoring, or restrictions can erode another person's autonomy.","example":"Someone restricts your access to friends or money and threatens consequences for resisting.","response":"‘I need support and a safe way to evaluate my options.’","note":"This may be a safety issue; direct confrontation may increase danger.","next":"Prioritize safety and support from trusted people or qualified services."},{"name":"Repair and accountability","category":"Healthy alternatives","sign":"A constructive response owns a specific action, acknowledges impact, and commits to change.","example":"‘I was wrong to raise my voice. I will pause next time instead.’","response":"‘Thank you for acknowledging it. What should we do differently next time?’","note":"A sincere apology matters, but consistent follow-through matters too.","next":"Track actions over time rather than relying only on words."}];
const cases=[{"title":"The changed date","category":"Truth & Evidence","setup":"A person originally said an event happened on Monday. Today they say Wednesday. No independent evidence is available.","options":[["‘Can you walk me through the sequence so I understand what changed?’","Strong: you invite detail without presuming dishonesty.",true],["‘You contradicted yourself, so you're lying.’","An inconsistency alone does not establish a lie.",false],["‘Your nervous expression proves you are hiding something.’","Emotional and nonverbal cues are not dependable lie detectors.",false]],"followup":"They reply: ‘I was remembering a different appointment. I need to check my calendar.’","nextOptions":[["‘Please check it. We can revisit this when we know the date.’","Strong: checking an independent record is more reliable than escalating.",true],["‘You're just making excuses again.’","This dismisses a plausible explanation before it can be checked.",false],["‘Then I will tell everyone you are dishonest.’","Threats make a factual conversation less safe and reliable.",false]]},{"title":"The guilt test","category":"Boundaries","setup":"You say you need time to consider a request. Someone replies: ‘If you cared about me, you'd say yes now.’","options":[["‘I care about you, and I still need time to decide.’","Strong: you maintain both empathy and autonomy.",true],["‘Fine, I agree so you'll stop.’","A pressured yes may not reflect your decision.",false],["‘I'll make you feel guilty too.’","Retaliation reinforces an unhealthy dynamic.",false]],"followup":"They add: ‘So you're going to leave me waiting?’","nextOptions":[["‘I'll give you an answer tomorrow after I think it through.’","Strong: a clear, reasonable timeframe can reduce uncertainty without surrendering choice.",true],["‘You deserve to wait forever.’","Punishment is not a constructive boundary.",false],["‘I guess I must say yes now.’","You do not have to agree simply to stop pressure.",false]]},{"title":"The derailed conversation","category":"Accountability","setup":"You raise a specific broken promise. The other person begins listing unrelated mistakes you've made.","options":[["‘Those may matter too. Could we finish this issue first?’","Strong: acknowledges their concerns and keeps the conversation focused.",true],["‘You always manipulate everyone.’","Global labels invite argument rather than clarification.",false],["‘I'll use your secrets against you unless you answer.’","Exploitation and threats are harmful and unreliable.",false]],"followup":"They say: ‘My complaints are important too.’","nextOptions":[["‘They are. Let's agree to discuss both, one at a time.’","Strong: it preserves fairness and structure.",true],["‘Only my problems matter.’","Dismissal makes constructive resolution less likely.",false],["‘Then neither of us will ever talk again.’","An ultimatum is often disproportionate to this situation.",false]]},{"title":"The public insult","category":"Boundaries","setup":"During a group discussion, someone makes a personal insult after you disagree.","options":[["‘I'm happy to discuss the idea, not personal insults.’","Strong: respectful redirection defines an acceptable interaction.",true],["‘You're pathetic, and everyone knows it.’","Counterattacks escalate.",false],["‘I'll agree with anything so this ends.’","Pressure need not determine your position.",false]],"followup":"They say: ‘Can't you take a joke?’","nextOptions":[["‘I can take humor. Let's return to the topic without personal remarks.’","Strong: you avoid a debate about intention and return to conduct.",true],["‘You're clearly mentally ill.’","Diagnosing someone during a conflict is inappropriate.",false],["‘I'll embarrass you more than you embarrassed me.’","Revenge does not create a safer conversation.",false]]},{"title":"The urgent demand","category":"Pressure","setup":"Someone insists that you make a costly decision immediately or lose their approval.","options":[["‘I don't make expensive commitments under time pressure.’","Strong: slows the situation and protects informed choice.",true],["‘I'll pay now to prove loyalty.’","This accepts coercive pressure.",false],["‘I'll invent a crisis to make you stop.’","Deception is neither necessary nor constructive.",false]],"followup":"They say: ‘The opportunity will disappear!’","nextOptions":[["‘Then I may have to pass. I need enough information before deciding.’","Strong: you are willing to decline an unverifiable urgency claim.",true],["‘You win. I'll decide now.’","Pressure alone should not set the deadline.",false],["‘I'll threaten you unless you extend it.’","Threats worsen the situation.",false]]},{"title":"The uncertain memory","category":"Truth & Evidence","setup":"You and a friend remember an old conversation differently. Neither has a recording.","options":[["‘We may remember it differently. What can we actually verify?’","Strong: respects uncertainty and looks for evidence.",true],["‘My memory is always right.’","Human memory is fallible.",false],["‘You're gaslighting me, no question.’","One disagreement is insufficient to establish a pattern.",false]],"followup":"They reply: ‘There isn't any record. What now?’","nextOptions":[["‘Let's be clear about what each of us recalls and avoid claiming certainty.’","Strong: uncertainty is an honest outcome.",true],["‘Then I'll force you to admit my account is right.’","Coercion is not fact-finding.",false],["‘No record means you are guilty.’","Absence of a record does not establish a particular account.",false]]},{"title":"The shifting standard","category":"Accountability","setup":"Each time you meet an agreed request, the other person adds another requirement.","options":[["‘Can we write down the criteria we both agree to before continuing?’","Strong: documenting expectations helps test whether they are changing.",true],["‘You're evil for changing the conditions.’","Moral accusations are unlikely to clarify expectations.",false],["‘I'll secretly change the rules too.’","Retaliatory manipulation compounds confusion.",false]],"followup":"They say: ‘My needs have changed.’","nextOptions":[["‘That can happen. What changed, and what is a realistic new agreement?’","Strong: checks for legitimate changes without ignoring the pattern.",true],["‘Your needs are never allowed to change.’","Valid needs can evolve.",false],["‘Then I have to accept every new demand.’","You retain the right to negotiate or decline.",false]]},{"title":"The vague accusation","category":"Truth & Evidence","setup":"Someone says, ‘Everybody knows what you did,’ but provides no specific claim.","options":[["‘What exactly are you referring to? I want to respond to the specific concern.’","Strong: asks for an assessable claim.",true],["‘Whoever said that is lying.’","You have not yet heard the accusation.",false],["‘I'll find ways to get under your skin until you confess.’","Provocation does not reliably establish the truth.",false]],"followup":"They respond: ‘You know what I mean.’","nextOptions":[["‘I don't want to guess. If you can be specific, we can discuss it.’","Strong: refuses to argue with an undefined allegation.",true],["‘Then you're obviously a liar.’","That conclusion is unsupported.",false],["‘Fine, I admit everything.’","Do not agree to vague accusations simply to end tension.",false]]},{"title":"The apology with conditions","category":"Accountability","setup":"Someone apologizes for an insult, then says your reaction proves you deserved it.","options":[["‘I appreciate the apology. Can we discuss the insult without blaming my reaction for it?’","Strong: separates accountability from later disagreements.",true],["‘You're worthless at apologizing.’","Personal attacks undermine repair.",false],["‘I'll never let you apologize again.’","A sweeping punitive response may close off repair.",false]],"followup":"They reply: ‘But you upset me too.’","nextOptions":[["‘We can discuss both behaviors separately, and each take responsibility for our part.’","Strong: responsibility need not be a zero-sum contest.",true],["‘Only you ever do anything wrong.’","This rules out mutual accountability.",false],["‘Then your apology counts for nothing.’","The apology and any further accountability can be assessed separately.",false]]},{"title":"The silent treatment","category":"Boundaries","setup":"After a disagreement, someone stops communicating without explaining whether they need space.","options":[["‘I can respect space. Please let me know when we can return to the conversation.’","Strong: allows a pause without assuming motive.",true],["‘I'll message you a hundred times until you answer.’","Repeated unwanted contact violates boundaries.",false],["‘You're punishing me deliberately, and I know it.’","Silence alone cannot prove intent.",false]],"followup":"They reply later: ‘I wasn't ready to talk.’","nextOptions":[["‘Understood. Could we agree on a simple way to say we need a break next time?’","Strong: creates a workable communication agreement.",true],["‘You should never need a break.’","People may legitimately need time to regulate.",false],["‘Next time I'll ignore you for longer.’","Retaliation escalates conflict.",false]]},{"title":"The fake certainty","category":"Truth & Evidence","setup":"A person claims to know another individual's motives based only on a short social media post.","options":[["‘What evidence supports that interpretation? Could there be another explanation?’","Strong: encourages justified confidence and alternatives.",true],["‘That proves they have a personality disorder.’","You cannot diagnose someone from a post.",false],["‘Let's spread the claim to make them admit it.’","Public pressure and rumor are not ethical fact-finding.",false]],"followup":"They answer: ‘I can just tell what kind of person they are.’","nextOptions":[["‘That may be your impression, but let's separate impressions from confirmed facts.’","Strong: recognizes perception without treating it as verified.",true],["‘Your intuition makes you an expert.’","Confidence is not a substitute for evidence.",false],["‘Then let's expose their private information.’","Private information should not be weaponized.",false]]},{"title":"The work disagreement","category":"Influence","setup":"A colleague dismisses your proposal without explaining why.","options":[["‘Which part concerns you most? I'd like to understand the trade-offs.’","Strong: you seek useful criteria before persuading.",true],["‘You'll regret not supporting me.’","Threatening consequences is coercive.",false],["‘I'll flatter you until you agree.’","Manipulative praise does not address the decision.",false]],"followup":"They say: ‘I worry the plan will cost too much.’","nextOptions":[["‘Let's compare expected costs, benefits, and a smaller pilot option.’","Strong: shared evidence and alternatives support informed choice.",true],["‘You are too negative to understand.’","An insult sidesteps the concern.",false],["‘I'll hide the costs until after approval.’","Concealing material information is deceptive.",false]]}];
const guides=[{"title":"When they change the story","say":"‘I heard two different versions. Can you help me understand the timeline?’","why":"Clarifies a discrepancy without assuming deception."},{"title":"When they blame you for asking","say":"‘I'm asking about this specific issue. We can discuss other concerns afterward.’","why":"Returns the conversation to the topic."},{"title":"When they insult you","say":"‘I'll continue when we can speak without insults.’","why":"Sets a boundary under your control."},{"title":"When they demand an immediate answer","say":"‘I'm not making this decision under pressure. I'll respond after I've considered it.’","why":"Protects informed choice."},{"title":"When they deny your recollection","say":"‘We remember this differently. Let's check what can actually be verified.’","why":"Separates memory disputes from documented facts."},{"title":"When the conversation becomes circular","say":"‘We're repeating the same points. I'm going to pause this conversation.’","why":"Prevents an unproductive loop."},{"title":"When someone uses guilt","say":"‘I care about your feelings. I still need to choose what works for me.’","why":"Separates empathy from automatic compliance."},{"title":"When your boundary is ignored","say":"‘I've said no. If this continues, I'll leave this conversation.’","why":"States an action under your control."},{"title":"When someone mocks your concern","say":"‘This matters to me. If we can't discuss it respectfully, I'll pause.’","why":"Keeps the focus on respect."},{"title":"When a disagreement gets personal","say":"‘Can we focus on the decision rather than criticizing each other?’","why":"Redirects from identity attacks to the issue."},{"title":"When someone claims everyone agrees","say":"‘I'd like to discuss the facts directly rather than unnamed opinions.’","why":"Avoids pressure from unverifiable social consensus."},{"title":"When a new requirement appears","say":"‘Can we agree on clear expectations before I continue?’","why":"Clarifies changing standards."},{"title":"When you need to verify a claim","say":"‘What source supports that? Let's check it together.’","why":"Invites shared evidence."},{"title":"When an apology comes with blame","say":"‘I appreciate the apology. I also want to talk about the specific behavior.’","why":"Keeps accountability clear."},{"title":"When someone assumes your intentions","say":"‘I understand the impact. Can I explain what I intended?’","why":"Distinguishes intention from impact."},{"title":"When you need time","say":"‘I won't make this decision today. I'll revisit it after I've thought it through.’","why":"Reinforces the right to deliberate."},{"title":"When silence follows conflict","say":"‘I can respect a break. Let's agree when to check in again.’","why":"Respects space while seeking clarity."},{"title":"When you're being pressured publicly","say":"‘I'd rather talk about this privately when we're both ready.’","why":"Moves away from social pressure."},{"title":"When the conversation feels unsafe","say":"‘I'm ending this conversation now.’","why":"Prioritizes disengagement over winning."},{"title":"When you're asked for a confession","say":"‘I won't agree to something I don't believe happened. Let's review the evidence.’","why":"Prevents pressured false admissions."},{"title":"When you notice a pattern","say":"‘This has happened several times. I'd like to discuss one concrete example.’","why":"Uses specific examples instead of labels."}];
let page="home",caseIndex=0,answer=-1,query="",labStep=0,firstAnswer=-1,labCategory="All",patternQuery="",patternCategory="All";
const safeParse=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const journal=safeParse("bia-journal-v1",[]);
const practice=safeParse("bia-practice-v1",[]);
const escapeHTML=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("\u0027","&#39;");
const completed=new Set(safeParse("bia-lessons-v1",[]));

function menus(){for(const id of ["desktop-menu","mobile-menu"]){document.getElementById(id).innerHTML=nav.map(n=>'<button class="nav '+(page===n[0]?'active':'')+'" data-page="'+n[0]+'"><span class="symbol">'+n[1]+'</span>'+n[2]+'</button>').join('')}}
function openPage(next){page=next;answer=-1;labStep=0;firstAnswer=-1;render();window.scrollTo({top:0,behavior:"instant"});document.getElementById("mobile-menu").classList.add("hide");document.getElementById("menu-toggle").setAttribute("aria-expanded","false")}
function section(title,content){return '<section class="detail"><h1>'+title+'</h1>'+content+'</section>'}
function render(){menus();let out="";
if(page==="home"){out='<div class="hero"><div class="card hero-main"><div class="eyebrow">Behavioral intelligence</div><h1>Understand the pattern.<br>Choose your response.</h1><p class="lead">A practical guide to difficult personalities, manipulation recognition, evidence-based questioning, and confident communication.</p><button class="btn" data-page="practice">Start conversation practice →</button></div><div class="card hero-side"><div><div class="eyebrow">Your training progress</div><div class="number">'+completed.size+' / '+lessons.length+'</div><p>Short lessons completed · '+practice.length+' scenarios practiced</p></div><button class="btn secondary" data-page="learn">Continue learning →</button></div></div><h2 class="section-heading">Your workspace</h2><div class="grid">'+[['learn','◫','Short Lessons','Practical psychology in just a few minutes.'],['patterns','◇','Recognize Patterns','Spot manipulation tactics and understand their limitations.'],['practice','▤','Conversation Lab','Practice responses to realistic scenarios.'],['guide','☷','Quick Response Guide','Find calm, clear words for difficult moments.'],['journal','✎','Reflection Journal','Privately reflect on what you learned.']].map(n=>'<div class="card tile"><div class="ico">'+n[1]+'</div><h3>'+n[2]+'</h3><p>'+n[3]+'</p><button class="go" data-page="'+n[0]+'">Open →</button></div>').join('')+'</div>'}
if(page==="learn"){out=section("Short lessons",'<p class="lead">Learn the essential ideas without a college-style syllabus. Every lesson includes a takeaway and a quick exercise.</p><div class="list">'+lessons.map((l,i)=>'<div class="card lesson-card"><div><div class="mini">'+l.category+' · '+l.time+'</div><h3>'+l.title+'</h3><span class="pill">'+(completed.has(i)?"Completed":"Ready to learn")+'</span></div><button class="btn secondary" data-lesson="'+i+'">Open →</button></div>').join('')+'</div>')}
if(page==="lesson"){const i=window.currentLesson||0,l=lessons[i];out=section(l.title,'<div class="mini">'+l.category+' · '+l.time+'</div><div class="card article"><p>'+l.body+'</p><h3>Remember</h3><p class="response">'+l.take+'</p><h3>Practice</h3><p>'+l.exercise+'</p><div class="actions"><button class="btn" data-complete="'+i+'">'+(completed.has(i)?"Completed ✓":"Mark lesson complete ✓")+'</button><button class="btn secondary" data-page="learn">All lessons</button></div></div>')}
if(page==="patterns"){const cats=["All",...new Set(patterns.map(x=>x.category))];const filtered=patterns.filter(x=>(patternCategory==="All"||x.category===patternCategory)&&(x.name+" "+x.sign+" "+x.example+" "+x.note).toLowerCase().includes(patternQuery.toLowerCase()));out=section("Behavioral Pattern Library",'<p class="lead">Explore 21 behavior patterns with recognizable examples, grounded response options, and alternative explanations. These descriptions cannot diagnose a person or determine intent.</p><div class="card"><label for="pattern-search"><strong>Search behaviors</strong></label><input id="pattern-search" class="search" placeholder="Try gaslighting, blame, boundaries..." value="'+escapeHTML(patternQuery)+'"><label for="pattern-category"><strong>Filter by area</strong></label><select id="pattern-category" class="search">'+cats.map(c=>'<option value="'+escapeHTML(c)+'" '+(patternCategory===c?'selected':'')+'>'+escapeHTML(c)+'</option>').join('')+'</select><div class="muted">'+filtered.length+' of '+patterns.length+' entries</div></div><div class="list" style="margin-top:14px">'+(filtered.length?filtered.map(x=>'<article class="card"><div class="mini">'+escapeHTML(x.category)+'</div><h3>'+escapeHTML(x.name)+'</h3><p><strong>What it means:</strong> '+escapeHTML(x.sign)+'</p><p><strong>Example:</strong> '+escapeHTML(x.example)+'</p><p class="response"><strong>Possible response:</strong> '+escapeHTML(x.response)+'</p><p><strong>Other explanations:</strong> '+escapeHTML(x.note)+'</p><p class="muted"><strong>Next step:</strong> '+escapeHTML(x.next)+'</p></article>').join(''):'<div class="card">No matching entries. Try another term.</div>')+'</div>')}
if(page==="practice"){const c=cases[caseIndex],opts=labStep===0?c.options:c.nextOptions,stageText=labStep===0?c.setup:c.followup;const categories=["All",...new Set(cases.map(x=>x.category))];out=section("Conversation Lab",'<p class="lead">Twelve two-stage simulations. Choose a response and consider the other person\'s reaction. Feedback teaches evidence, boundaries, and ethical influence—not tricks to force confessions.</p><div class="card"><label for="lab-filter"><strong>Choose a skill</strong></label><select class="search" id="lab-filter">'+categories.map(cat=>'<option value="'+escapeHTML(cat)+'" '+(cat===labCategory?'selected':'')+'>'+escapeHTML(cat)+'</option>').join('')+'</select><div class="mini">Scenario '+(caseIndex+1)+' of '+cases.length+' · '+escapeHTML(c.category)+' · Round '+(labStep+1)+' of 2</div><h2>'+escapeHTML(c.title)+'</h2><p>'+escapeHTML(stageText)+'</p><h3>How would you respond?</h3>'+opts.map((o,i)=>'<button class="option '+(answer===i?"chosen":"")+'" data-answer="'+i+'">'+escapeHTML(o[0])+'</button>').join('')+(answer>=0?'<div class="feedback"><strong>'+(opts[answer][2]?"Effective approach":"Learning opportunity")+'</strong><p>'+escapeHTML(opts[answer][1])+'</p></div>':'')+'<div class="actions">'+(labStep===0?'<button class="btn" data-labcontinue="1" '+(answer<0?'disabled':'')+'>See what happens next →</button>':'<button class="btn" data-nextcase="1" '+(answer<0?'disabled':'')+'>Finish and try next scenario →</button>')+'<button class="btn secondary" data-labreset="1">Start this scenario again</button></div></div><p class="muted" style="margin-top:13px">'+practice.length+' completed sessions saved on this device.</p>')}
if(page==="journal"){out=section("Reflection Journal",'<p class="lead">Reflect on fictional practice scenarios or your own reactions. Notes are stored only in this browser on this device. Avoid adding sensitive information about anyone.</p><div class="card"><label for="journal-entry"><strong>What did you learn or want to practice?</strong></label><textarea id="journal-entry" class="search" rows="5" maxlength="1500" placeholder="Example: Next time I want to ask one neutral question before reacting."></textarea><button class="btn" data-savejournal="1">Save reflection</button></div><div class="section-heading"><h2>Saved reflections</h2><p class="muted">'+journal.length+' entries on this device</p></div><div class="list">'+(journal.length?journal.map((j,i)=>'<div class="card"><div class="mini">'+escapeHTML(j.date)+'</div><p style="white-space:pre-wrap">'+escapeHTML(j.text)+'</p><button class="btn secondary" data-deletejournal="'+i+'">Delete entry</button></div>').join(''):'<div class="card">No reflections saved yet.</div>')+'</div>')}
if(page==="guide"){const filtered=guides.filter(x=>(x.title+" "+x.say+" "+x.why).toLowerCase().includes(query.toLowerCase()));out=section("Quick Response Guide",'<p class="lead">Find respectful, firm responses you can adapt to your own words. These are starting points, not scripts guaranteed to change another person.</p><input class="search" id="guide-search" aria-label="Search responses" placeholder="Search a situation (e.g. blame, pressure, insults)" value="'+query.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")+'"><div class="list">'+(filtered.length?filtered.map((g,i)=>'<div class="card"><h3>'+g.title+'</h3><p class="response">'+g.say+'</p><p class="muted">'+g.why+'</p><button class="btn secondary" data-copy="'+guides.indexOf(g)+'">Copy response</button></div>').join(''):'<div class="card">No matching responses. Try a different search.</div>')+'</div>')}
document.getElementById("view").innerHTML=out+'<div class="notice">Educational information, not clinical diagnosis, therapy, lie detection, or a substitute for safety planning. If someone is threatening or abusive, prioritize your safety and outside support.</div>'}
document.body.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.page)openPage(b.dataset.page);if(b.dataset.lesson!==undefined){window.currentLesson=+b.dataset.lesson;openPage("lesson")}if(b.dataset.complete!==undefined){completed.add(+b.dataset.complete);localStorage.setItem("bia-lessons-v1",JSON.stringify([...completed]));render()}if(b.dataset.answer!==undefined){answer=+b.dataset.answer;render()}if(b.dataset.labcontinue&&answer>=0){firstAnswer=answer;labStep=1;answer=-1;render()}if(b.dataset.labreset){labStep=0;answer=-1;firstAnswer=-1;render()}if(b.dataset.nextcase&&answer>=0){practice.push({caseIndex,firstAnswer,answer,date:new Date().toISOString()});localStorage.setItem("bia-practice-v1",JSON.stringify(practice));let next=(caseIndex+1)%cases.length;if(labCategory!=="All"){for(let i=0;i<cases.length;i++){const candidate=(caseIndex+1+i)%cases.length;if(cases[candidate].category===labCategory){next=candidate;break}}}caseIndex=next;answer=-1;firstAnswer=-1;labStep=0;render()}if(b.dataset.savejournal){const v=document.getElementById("journal-entry")?.value.trim();if(v){journal.unshift({text:v.slice(0,1500),date:new Date().toLocaleDateString()});localStorage.setItem("bia-journal-v1",JSON.stringify(journal));render()}}if(b.dataset.deletejournal!==undefined){journal.splice(+b.dataset.deletejournal,1);localStorage.setItem("bia-journal-v1",JSON.stringify(journal));render()}if(b.dataset.copy!==undefined){const t=guides[+b.dataset.copy].say;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied ✓"},()=>{b.textContent="Select and copy the response above"})}else{b.textContent="Select and copy the response above"}}});
document.body.addEventListener("change",e=>{if(e.target.id==="pattern-category"){patternCategory=e.target.value;render()}if(e.target.id==="lab-filter"){labCategory=e.target.value;caseIndex=labCategory==="All"?0:cases.findIndex(c=>c.category===labCategory);labStep=0;firstAnswer=-1;answer=-1;render()}});
document.body.addEventListener("input",e=>{if(e.target.id==="pattern-search"){const pos=e.target.selectionStart;patternQuery=e.target.value;render();const i=document.getElementById("pattern-search");i.focus();i.setSelectionRange(pos,pos)}if(e.target.id==="guide-search"){const pos=e.target.selectionStart;query=e.target.value;render();const i=document.getElementById("guide-search");i.focus();i.setSelectionRange(pos,pos)}});
document.getElementById("menu-toggle").addEventListener("click",e=>{const m=document.getElementById("mobile-menu"),opened=m.classList.toggle("hide")===false;e.currentTarget.setAttribute("aria-expanded",String(opened))});
render();
</script>
</body></html>
