s, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"OpenStax — Personality Traits and Big Five","url":"https://openstax.org/books/psychology-2e/pages/11-7-trait-theorists"},{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"}],"integratedCase":{"title":"The jealousy accusation without supporting observations","scene":"After Kai congratulates a colleague on a promotion, their partner Morgan says, 'You're jealous of everyone who succeeds.' Kai asks what behavior gave that impression. Morgan cites no example and says Kai is 'obviously hiding it.'","mechanism":"Projection is a psychodynamic hypothesis about attributing one's own unacceptable experience to another person. The observable behavior here is an unsupported assertion about Kai's hidden motive. It would be an additional, unproven leap to declare Morgan is projecting because Morgan is secretly jealous. Psychology vocabulary should not masquerade as mind reading.","impact":"Kai may feel misunderstood, defend against an untestable accusation, or withdraw from conversations. Repeated unsupported motive claims can damage trust, though one accusation alone does not establish abuse.","alternatives":"Morgan may have noticed an earlier remark or be interpreting Kai's tone differently. Kai's feelings may also be mixed. Those possibilities deserve more specificity instead of a counterdiagnosis.","response":"Kai can request an observable example: 'What did I do or say that led you to that conclusion?' They can discuss actual behavior while declining to debate what someone insists they secretly feel.","boundary":"When accusations are used to justify surveillance, humiliation, or punishment, focus on those acts and personal safety rather than the hypothetical defense mechanism.","sources":[{"title":"OpenStax — Personality Traits and Big Five","url":"https://openstax.org/books/psychology-2e/pages/11-7-trait-theorists"},{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"}]}},{"name":"Stonewalling","category":"Conflict tactics","goal":"Offer a pause and clear return path where safe.","approach":"Avoid forcing discussion. Suggest an agreed time or written channel for practical obligations.","script":"'We can pause. Is tomorrow a workable time to revisit the plan?'","avoid":"Don't pursue someone relentlessly or require a threatened person to reengage.","warning":"Avoidance prevents urgent obligations from being addressed or becomes punitive coercion.","example":"You: 'Can we discuss the plan?' Them: 'I'm done.' You: 'I can pause. Would tomorrow at six work to finish this?'","reference":"Look at whether the person returns, can identify limits, and engages when conditions are calmer. You cannot force a conversation.","steps":["First, describe the specific observable behavior without assuming a diagnosis: A person disengages from conversation in a way that prevents resolution.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}],"integratedCase":{"title":"A conversation ends before any decision is made","scene":"Every time Priya asks her roommate Owen about overdue rent, he changes the subject, stops answering, and leaves. After several weeks, the unpaid amount grows. On another day Owen says he is overwhelmed and suggests discussing it Saturday, then follows through.","mechanism":"Stonewalling describes withdrawal that blocks engagement, but its function and meaning vary. The first pattern leaves an urgent obligation unaddressed; the second is a time-limited pause with a return plan. An overwhelmed or unsafe person may legitimately need distance. The pattern cannot be judged by silence alone.","impact":"Priya may experience financial anxiety and uncertainty. Owen may also feel stress. Repeatedly unresolved obligations can undermine trust; a respectful pause does not have the same consequences.","alternatives":"Owen may have insufficient funds, be ashamed, or need time to gather information. Avoidance does not tell Priya the cause, and the rent problem still requires practical resolution.","response":"Priya can document the balance, set a clear written deadline, and propose a specific discussion time. If no conversation occurs, she can use appropriate housing or mediation processes rather than escalating personal pursuit.","boundary":"Do not force contact when someone requests safety-related distance. Threats or abusive dynamics require a different approach.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}]}},{"name":"Intermittent reinforcement","category":"Relationship patterns","goal":"Judge reliable follow-through instead of chasing reassurance.","approach":"Notice what agreements are made and whether they are kept. Maintain personal routines and support.","script":"'I need a consistent agreement. If that's not possible, I'll plan independently.'","avoid":"Don't conclude variable attention always reflects deliberate psychological conditioning.","warning":"Unpredictable attention is paired with isolation, threats, or forced dependence.","example":"One week someone makes big promises and is affectionate; the next they disappear without explanation. You ask whether there is a realistic, consistent commitment rather than trying to earn the return of affection.","reference":"Evaluate consistency, mutual expectations, and your own well-being over time. Do not treat every fluctuating mood as a calculated strategy.","steps":["First, describe the specific observable behavior without assuming a diagnosis: Unpredictable rewarding and withholding may strengthen a difficult attachment.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}],"integratedCase":{"title":"Promises and disappearances in a friendship","scene":"Tessa frequently promises to help Arun prepare for interviews and sends encouraging messages. She then repeatedly cancels at the last minute without explanation, before later offering intense reassurance. Arun keeps rearranging his schedule, hoping this time the commitment will hold.","mechanism":"Intermittent reinforcement is a learning concept in which rewards occur unpredictably; it is sometimes invoked to explain persistent pursuit of uncertain rewards. The present facts establish inconsistent follow-through, not that Tessa is intentionally conditioning Arun. Ordinary scheduling problems or changing priorities can create the same appearance.","impact":"Arun may become preoccupied with receiving reassurance, lose time, and doubt whether commitments can be trusted. Long-term effects depend on frequency and context; a disappointing friendship is not necessarily traumatic.","alternatives":"Tessa may genuinely want to help but overcommit or face unpredictable responsibilities. A clear conversation about capacity might resolve the problem.","response":"Arun can evaluate reliability through observed follow-through, make independent arrangements, and say: 'I appreciate the offer, but I need a dependable schedule, so I'll arrange another practice partner.'","boundary":"If inconsistent affection is used with intimidation, dependence, or threats, consider broader coercive dynamics rather than only a learning theory.","sources":[{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}]}},{"name":"Minimization","category":"Reality & evidence","goal":"Discuss the specific impact and requested change.","approach":"Name what was said, how it affected the issue, and what conduct should stop.","script":"'You may have meant it as a joke. I don't want that remark repeated.'","avoid":"Don't get trapped proving the person's private intention.","warning":"Belittling continues after clear discussion or escalates to intimidation.","example":"Them: 'It was only a joke; stop being dramatic.' You: 'I understand you meant it as humor. I don't want that comment repeated.'","reference":"Name the concrete behavior, describe its effect, and evaluate whether it changes. Do not get stuck proving how hurt you were.","steps":["First, describe the specific observable behavior without assuming a diagnosis: A harmful or consequential event is dismissed as insignificant.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}],"integratedCase":{"title":"The recurring remark described as a joke","scene":"Nadia tells her coworker Chris that repeated comments about her intelligence are embarrassing. Chris replies, 'Relax, it's only a joke. You're too sensitive.' He makes the same comment during the next meeting.","mechanism":"A speaker's stated intention and the actual effect on others are separate matters. Calling a remark a joke does not resolve whether it was hurtful or appropriate. Minimization can involve reducing the perceived seriousness of conduct. However, people can genuinely disagree about tone or context; the crucial evidence includes repetition after clear feedback.","impact":"Nadia may avoid contributing in meetings or feel that objections will be mocked. Repeated public belittling can undermine confidence and group participation; a single poorly received joke may be resolved through communication.","alternatives":"Chris may have thought the joke was harmless or been unaware of its impact. The recurrence after feedback provides more information about willingness to change than the first remark alone.","response":"Nadia can describe the exact remark and request an observable change: 'Please don't make comments about my intelligence in meetings.' She can document recurrence and use workplace processes if necessary.","boundary":"If remarks become threats or discriminatory harassment, a private conversation may not be the safest or most effective remedy.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}]}},{"name":"Selective evidence","category":"Reality & evidence","goal":"Read the complete evidence and test alternatives.","approach":"Ask for original documents, surrounding messages, and context that might change the interpretation.","script":"'Can we review the full conversation rather than one excerpt?'","avoid":"Don't retaliate with cherry-picked evidence or assume every omission is deliberate.","warning":"Edited claims are being spread to harass or threaten you.","example":"A person shows one message that sounds threatening; the full conversation reveals it was a quote from a fictional story. The correct interpretation changes when context is restored.","reference":"Ask for complete timelines and original sources. Search for evidence that could disconfirm your initial conclusion.","steps":["First, describe the specific observable behavior without assuming a diagnosis: Only supporting facts are presented while contrary information is ignored.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}],"integratedCase":{"title":"The screenshot that omits its context","scene":"Alex shows mutual friends a screenshot in which Blair writes, 'I cannot believe you said that.' The earlier messages, which Blair was responding to, are omitted. Friends begin blaming Blair without reading the full conversation.","mechanism":"Selective evidence occurs when the presented sample excludes material that could change interpretation. The screenshot may be authentic but insufficient. Selection can be deliberate or incidental. The fact that a source is partial does not establish that the missing context exonerates or condemns anyone; it creates uncertainty requiring more information.","impact":"Blair's reputation may suffer and friendships may become strained. People may become defensive or mistrustful if important discussions are reduced to curated excerpts. These effects are relational, not inherently clinical trauma.","alternatives":"Alex may have shared the only portion available or believed it captured the dispute accurately. Blair could also have behaved badly in the omitted material. The fair response is to seek relevant context without assuming an outcome.","response":"Request the original conversation where appropriate, compare claims to complete records, and state which facts remain unknown. Avoid replying with equally selective screenshots.","boundary":"If edited evidence is spread to threaten or harass someone, preserve originals and use appropriate reporting or support channels.","sources":[{"title":"OpenStax — Attitudes and Persuasion","url":"https://openstax.org/books/psychology-2e/pages/12-3-attitudes-and-persuasion"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}]}},{"name":"Mind-reading claims","category":"Thinking traps","goal":"Separate an observable event, impact, and assumed motive.","approach":"Acknowledge how someone felt while clarifying your action and what you intended.","script":"'I understand it felt dismissive. I missed the message; how can we handle urgent requests?'","avoid":"Don't call the other person's feelings imaginary or accept unsupported motive claims as facts.","warning":"Repeated accusations lead to controlling monitoring or punishment.","example":"Them: 'You ignored me on purpose.' You: 'I didn't see the message. I understand it felt dismissive; let's discuss how to avoid that.'","reference":"Ask what observable event supports the claim and what other explanations might fit. Acknowledge impact without agreeing to an unsupported intention.","steps":["First, describe the specific observable behavior without assuming a diagnosis: Someone asserts certainty about another person's intentions without evidence.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"OpenStax — Personality Traits and Big Five","url":"https://openstax.org/books/psychology-2e/pages/11-7-trait-theorists"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}],"integratedCase":{"title":"The motive assigned to an unanswered message","scene":"After sending a request late at night, Fin tells Jo, 'You ignored me because you wanted to punish me.' Jo explains their phone was off and that they saw the message the next morning. Fin insists that Jo's hidden intention is obvious.","mechanism":"The observable event is an unanswered message. A claim about why Jo did not reply is an inference, even when Fin feels hurt. Distinguish behavior, its impact, and presumed motive. People may interpret another's actions through prior experiences, expectations, or anxiety, but those influences do not confirm the interpretation.","impact":"Jo may feel unfairly accused; Fin may feel rejected. Repeated assumptions about intent can produce escalating defensiveness and reduce the ability to discuss practical expectations.","alternatives":"Jo may be concealing an intention, but the available facts are insufficient to establish that. Fin's hurt can be genuine even when the explanation is mistaken.","response":"Jo can acknowledge the experience without adopting an unsupported accusation: 'I understand the delay felt upsetting. My phone was off. For urgent issues, call my work number.'","boundary":"If claims about intentions justify monitoring, threats, or controlling demands, focus on those actions rather than debating feelings.","sources":[{"title":"OpenStax — Personality Traits and Big Five","url":"https://openstax.org/books/psychology-2e/pages/11-7-trait-theorists"},{"title":"OpenStax — Conformity, Compliance, and Obedience","url":"https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience"}]}},{"name":"Boundary testing","category":"Relationship patterns","goal":"State a limit and an action under your control.","approach":"Say no clearly, clarify once if needed, then disengage or enforce a reasonable consequence.","script":"'My answer is no. If the pressure continues, I'm leaving this conversation.'","avoid":"Don't threaten retaliation or negotiate endlessly to prove your boundary.","warning":"Limits are repeatedly violated and refusal brings retaliation.","example":"You: 'I don't share my phone password.' Them: 'If you loved me, you would.' You: 'My answer hasn't changed. I'm ending this discussion.'","reference":"State the boundary plainly once, clarify if needed, then prioritize your own actions rather than trying to change the other's internal state.","steps":["First, describe the specific observable behavior without assuming a diagnosis: Someone repeatedly challenges a plainly communicated limit.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"},{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"}],"integratedCase":{"title":"A repeated request after a clear no","scene":"Harper tells a friend they will not share a personal password. The friend asks again the next day, then frames refusal as a sign that Harper has something to hide. Harper feels pressured to prove trust.","mechanism":"Boundary testing can describe repeated attempts to see whether a stated limit will hold. It need not imply a calculated psychological strategy; some people misunderstand or resist a limit. The concerning feature is repeated pressure after refusal, especially when the request involves privacy, autonomy, or safety.","impact":"Harper may begin doubting whether saying no is allowed, feel guilty, or change behavior to avoid further demands. Such effects can worsen when refusal triggers retaliation or material consequences.","alternatives":"The friend may not understand the security implications or might have a legitimate need for a different type of access. Those needs can be discussed without sharing Harper's credentials.","response":"Harper can repeat the limit briefly: 'I don't share passwords. If you need information, let's find another way.' Further requests need not be answered with an extended defense.","boundary":"Threats, stalking, unauthorized access, or coercion call for security measures and support, not simply firmer wording.","sources":[{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"},{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"}]}},{"name":"Narcissistic traits vs. NPD","category":"Personality & behavior","goal":"Respond to behavior, not an amateur personality diagnosis.","approach":"Make measurable requests, document expectations, and evaluate whether accountability improves over time.","script":"'I need accurate credit for my work. I'll document contributions if that remains unresolved.'","avoid":"Don't diagnose NPD yourself or believe a label predicts every action.","warning":"Humiliation, isolation, threats, or controlling demands affect safety.","example":"At a team meeting, someone takes excessive credit and reacts badly to feedback. You can address attribution and professional standards without assigning a personality disorder.","reference":"Evaluate repeated conduct and consequences rather than trying to identify a secret 'narcissist' from snippets. A qualified clinician assesses diagnoses.","steps":["First, describe the specific observable behavior without assuming a diagnosis: Traits such as entitlement or heightened sensitivity to criticism exist on a continuum; NPD is a clinical diagnosis.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"OpenStax — Personality Traits and Big Five","url":"https://openstax.org/books/psychology-2e/pages/11-7-trait-theorists"},{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"}],"integratedCase":{"title":"A colleague who needs credit and reacts to correction","scene":"Dana regularly announces team achievements as personal successes. When another coworker asks to be credited for the calculations, Dana replies, 'You're jealous because I'm the only one who matters here.' The team stops raising attribution concerns.","mechanism":"The observable behaviors involve credit-taking, defensiveness, and dismissive language. They may relate to self-esteem, status concerns, learned incentives, or aspects of personality, but a workplace vignette cannot diagnose narcissistic personality disorder. A pervasive disorder requires clinical assessment, and someone's behavior can be harmful regardless of diagnosis.","impact":"Coworkers may become less willing to contribute ideas, report errors, or seek fair recognition. These are plausible consequences of the repeated pattern, not direct evidence of Dana's private thoughts. Serious intimidation would require a different level of response.","alternatives":"Dana may believe the team expects them to present outcomes as the leader, or the initial contribution agreement may be unclear. Records of who produced the work can resolve attribution without speculation about the person's personality.","response":"A coworker can make expectations specific: 'Please include the analysts' names on the next presentation. Here's the contribution record.' If this is repeatedly denied, they might use documented project processes rather than arguing about whether Dana is narcissistic.","boundary":"If correction prompts retaliation or threats, protect records and seek support through appropriate workplace channels.","sources":[{"title":"Research Resource","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5601176/"},{"title":"MSD Manual Professional","url":"https://www.msdmanuals.com/professional/psychiatric-disorders/personality-disorders/narcissistic-personality-disorder-npd"}]}},{"name":"Coercive control warning signs","category":"Safety & boundaries","goal":"Prioritize safety and independent resources over confrontation.","approach":"Consider confidential support, safe access to money and documents, device privacy, and an individualized safety plan.","script":"'I need time and independent advice before deciding anything.'","avoid":"Don't challenge the person to prove their power or announce safety plans if doing so could escalate danger.","warning":"Monitoring, stalking, financial restriction, threats, and fear of violence require specialist support.","example":"A partner demands access to every account, threatens to cut off money, and forbids contact with friends. Those combined actions merit serious attention to safety and support.","reference":"Consider safe ways to speak with trusted support or professional services. Do not use an app exercise as a substitute for an individualized safety plan.","steps":["First, describe the specific observable behavior without assuming a diagnosis: A pattern of intimidation, isolation, monitoring, or restrictions can erode another person's autonomy.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"},{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"}],"integratedCase":{"title":"Financial decisions under threat","scene":"Jordan manages the couple's account and tells Casey that access to grocery money will end if Casey visits relatives. Jordan also checks Casey's location and demands proof of where Casey has been. Casey gradually stops meeting friends to avoid conflict.","mechanism":"The defining concern is not a disagreement about spending or social plans. Access to necessary resources and relationships is being made conditional on compliance. Monitoring, isolation, and financial threats can combine to narrow a person's real options. Coercive control is best understood as a pattern and power relationship, rather than a personality label attached to someone who is difficult.","impact":"Casey may experience fear, isolation, loss of confidence, and difficulty making ordinary choices. Stress may affect sleep, concentration, work, and future trust. The exact psychological impact varies; no fictional vignette establishes PTSD or complex PTSD.","alternatives":"A jointly negotiated budget or mutually agreed location sharing can be legitimate. The key differences are meaningful choice, reciprocity, consent, and consequences for refusing.","response":"This is not a situation to resolve by finding a clever comeback. Confidential specialist advice and a safety plan may be more useful. Casey might seek independent access to documents and trusted support, taking account of the possibility that devices or communications are monitored.","boundary":"Do not recommend testing Jordan, threatening retaliation, or announcing plans if doing so could increase danger. Emergency services may be necessary if there is immediate risk.","sources":[{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"},{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"}]}},{"name":"Repair and accountability","category":"Healthy alternatives","goal":"Look for specific accountability and sustained change.","approach":"Discuss the action, impact, repair, and a realistic future plan; evaluate follow-through over time.","script":"'I appreciate the apology. What will be different next time?'","avoid":"Don't assume forgiveness is mandatory or that words alone establish lasting change.","warning":"Apologies are used to demand immediate contact or conceal recurring threats.","example":"Them: 'I raised my voice and interrupted you. That wasn't okay. Next time I'll take a break and return in twenty minutes.' You: 'I appreciate the plan. Let's see if that works.'","reference":"Assess whether a concrete change occurs over time. A meaningful repair process can include boundaries, mutual agreements, and outside assistance.","steps":["First, describe the specific observable behavior without assuming a diagnosis: A constructive response owns a specific action, acknowledges impact, and commits to change.","Second, decide what you need from this situation—clarity, a practical decision, accountability, distance, or safety. Your objective may differ from persuading the other person.","Third, choose a proportionate response and evaluate what happens next. A cooperative response supports further discussion; repeated retaliation or threats call for stronger boundaries or outside support."],"contexts":{"family":"In family settings, consider emotional ties, repeated expectations, shared responsibilities, and the ability to decline without punishment.","work":"At work, distinguish interpersonal friction from formal obligations. Written expectations, documentation, and appropriate workplace processes may be useful.","close":"In intimate relationships, pay attention to consent, financial dependence, isolation, and whether disagreement remains safe."},"outcomes":"No wording guarantees honesty or change. Look for concrete follow-through, respect for reasonable limits, and whether the same concern can be discussed without escalating pressure.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}],"integratedCase":{"title":"An apology followed by a measurable change","scene":"After publicly dismissing a colleague, Avery later says, 'I was wrong to interrupt and insult you.' Avery invites the colleague to finish the presentation at the next meeting and stops interrupting in subsequent sessions. In a contrasting situation, Avery apologizes each week but repeats the insult unchanged.","mechanism":"Repair involves recognizing a specific action and its impact, accepting appropriate responsibility, and changing future behavior. A sincere apology may include explanation but does not erase consequences. A pattern of repeated promises without follow-through gives different evidence than sustained improvement. The recipient may choose not to reconcile, even if the apology is sincere.","impact":"Consistent accountability can restore some trust and make collaboration safer. Empty apologies can increase frustration or lead others to doubt commitments. No one owes immediate forgiveness or renewed contact merely because an apology was offered.","alternatives":"Behavior may improve slowly; one setback does not necessarily negate progress. The seriousness of past harm and the recipient's autonomy also affect what repair is possible.","response":"A reader can look for specific acknowledgment, a practical remedy, follow-through over time, and respect for the other person's decision about future contact.","boundary":"When serious abuse or danger is involved, reconciliation is not a required goal. Safety and independent support may matter more than relational repair.","sources":[{"title":"VA — Psychological and Social Effects of IPV","url":"https://www.ptsd.va.gov/understand/types/violence_ipv.asp"},{"title":"CDC — Psychological Aggression and Intimate Partner Violence","url":"https://www.cdc.gov/intimate-partner-violence/about/"}]}}];
const cases=[{"title":"The changed date","category":"Truth & Evidence","setup":"A person originally said an event happened on Monday. Today they say Wednesday. No independent evidence is available.","options":[["‘Can you walk me through the sequence so I understand what changed?’","Strong: you invite detail without presuming dishonesty.",true],["‘You contradicted yourself, so you're lying.’","An inconsistency alone does not establish a lie.",false],["‘Your nervous expression proves you are hiding something.’","Emotional and nonverbal cues are not dependable lie detectors.",false]],"followup":"They reply: ‘I was remembering a different appointment. I need to check my calendar.’","nextOptions":[["‘Please check it. We can revisit this when we know the date.’","Strong: checking an independent record is more reliable than escalating.",true],["‘You're just making excuses again.’","This dismisses a plausible explanation before it can be checked.",false],["‘Then I will tell everyone you are dishonest.’","Threats make a factual conversation less safe and reliable.",false]]},{"title":"The guilt test","category":"Boundaries","setup":"You say you need time to consider a request. Someone replies: ‘If you cared about me, you'd say yes now.’","options":[["‘I care about you, and I still need time to decide.’","Strong: you maintain both empathy and autonomy.",true],["‘Fine, I agree so you'll stop.’","A pressured yes may not reflect your decision.",false],["‘I'll make you feel guilty too.’","Retaliation reinforces an unhealthy dynamic.",false]],"followup":"They add: ‘So you're going to leave me waiting?’","nextOptions":[["‘I'll give you an answer tomorrow after I think it through.’","Strong: a clear, reasonable timeframe can reduce uncertainty without surrendering choice.",true],["‘You deserve to wait forever.’","Punishment is not a constructive boundary.",false],["‘I guess I must say yes now.’","You do not have to agree simply to stop pressure.",false]]},{"title":"The derailed conversation","category":"Accountability","setup":"You raise a specific broken promise. The other person begins listing unrelated mistakes you've made.","options":[["‘Those may matter too. Could we finish this issue first?’","Strong: acknowledges their concerns and keeps the conversation focused.",true],["‘You always manipulate everyone.’","Global labels invite argument rather than clarification.",false],["‘I'll use your secrets against you unless you answer.’","Exploitation and threats are harmful and unreliable.",false]],"followup":"They say: ‘My complaints are important too.’","nextOptions":[["‘They are. Let's agree to discuss both, one at a time.’","Strong: it preserves fairness and structure.",true],["‘Only my problems matter.’","Dismissal makes constructive resolution less likely.",false],["‘Then neither of us will ever talk again.’","An ultimatum is often disproportionate to this situation.",false]]},{"title":"The public insult","category":"Boundaries","setup":"During a group discussion, someone makes a personal insult after you disagree.","options":[["‘I'm happy to discuss the idea, not personal insults.’","Strong: respectful redirection defines an acceptable interaction.",true],["‘You're pathetic, and everyone knows it.’","Counterattacks escalate.",false],["‘I'll agree with anything so this ends.’","Pressure need not determine your position.",false]],"followup":"They say: ‘Can't you take a joke?’","nextOptions":[["‘I can take humor. Let's return to the topic without personal remarks.’","Strong: you avoid a debate about intention and return to conduct.",true],["‘You're clearly mentally ill.’","Diagnosing someone during a conflict is inappropriate.",false],["‘I'll embarrass you more than you embarrassed me.’","Revenge does not create a safer conversation.",false]]},{"title":"The urgent demand","category":"Pressure","setup":"Someone insists that you make a costly decision immediately or lose their approval.","options":[["‘I don't make expensive commitments under time pressure.’","Strong: slows the situation and protects informed choice.",true],["‘I'll pay now to prove loyalty.’","This accepts coercive pressure.",false],["‘I'll invent a crisis to make you stop.’","Deception is neither necessary nor constructive.",false]],"followup":"They say: ‘The opportunity will disappear!’","nextOptions":[["‘Then I may have to pass. I need enough information before deciding.’","Strong: you are willing to decline an unverifiable urgency claim.",true],["‘You win. I'll decide now.’","Pressure alone should not set the deadline.",false],["‘I'll threaten you unless you extend it.’","Threats worsen the situation.",false]]},{"title":"The uncertain memory","category":"Truth & Evidence","setup":"You and a friend remember an old conversation differently. Neither has a recording.","options":[["‘We may remember it differently. What can we actually verify?’","Strong: respects uncertainty and looks for evidence.",true],["‘My memory is always right.’","Human memory is fallible.",false],["‘You're gaslighting me, no question.’","One disagreement is insufficient to establish a pattern.",false]],"followup":"They reply: ‘There isn't any record. What now?’","nextOptions":[["‘Let's be clear about what each of us recalls and avoid claiming certainty.’","Strong: uncertainty is an honest outcome.",true],["‘Then I'll force you to admit my account is right.’","Coercion is not fact-finding.",false],["‘No record means you are guilty.’","Absence of a record does not establish a particular account.",false]]},{"title":"The shifting standard","category":"Accountability","setup":"Each time you meet an agreed request, the other person adds another requirement.","options":[["‘Can we write down the criteria we both agree to before continuing?’","Strong: documenting expectations helps test whether they are changing.",true],["‘You're evil for changing the conditions.’","Moral accusations are unlikely to clarify expectations.",false],["‘I'll secretly change the rules too.’","Retaliatory manipulation compounds confusion.",false]],"followup":"They say: ‘My needs have changed.’","nextOptions":[["‘That can happen. What changed, and what is a realistic new agreement?’","Strong: checks for legitimate changes without ignoring the pattern.",true],["‘Your needs are never allowed to change.’","Valid needs can evolve.",false],["‘Then I have to accept every new demand.’","You retain the right to negotiate or decline.",false]]},{"title":"The vague accusation","category":"Truth & Evidence","setup":"Someone says, ‘Everybody knows what you did,’ but provides no specific claim.","options":[["‘What exactly are you referring to? I want to respond to the specific concern.’","Strong: asks for an assessable claim.",true],["‘Whoever said that is lying.’","You have not yet heard the accusation.",false],["‘I'll find ways to get under your skin until you confess.’","Provocation does not reliably establish the truth.",false]],"followup":"They respond: ‘You know what I mean.’","nextOptions":[["‘I don't want to guess. If you can be specific, we can discuss it.’","Strong: refuses to argue with an undefined allegation.",true],["‘Then you're obviously a liar.’","That conclusion is unsupported.",false],["‘Fine, I admit everything.’","Do not agree to vague accusations simply to end tension.",false]]},{"title":"The apology with conditions","category":"Accountability","setup":"Someone apologizes for an insult, then says your reaction proves you deserved it.","options":[["‘I appreciate the apology. Can we discuss the insult without blaming my reaction for it?’","Strong: separates accountability from later disagreements.",true],["‘You're worthless at apologizing.’","Personal attacks undermine repair.",false],["‘I'll never let you apologize again.’","A sweeping punitive response may close off repair.",false]],"followup":"They reply: ‘But you upset me too.’","nextOptions":[["‘We can discuss both behaviors separately, and each take responsibility for our part.’","Strong: responsibility need not be a zero-sum contest.",true],["‘Only you ever do anything wrong.’","This rules out mutual accountability.",false],["‘Then your apology counts for nothing.’","The apology and any further accountability can be assessed separately.",false]]},{"title":"The silent treatment","category":"Boundaries","setup":"After a disagreement, someone stops communicating without explaining whether they need space.","options":[["‘I can respect space. Please let me know when we can return to the conversation.’","Strong: allows a pause without assuming motive.",true],["‘I'll message you a hundred times until you answer.’","Repeated unwanted contact violates boundaries.",false],["‘You're punishing me deliberately, and I know it.’","Silence alone cannot prove intent.",false]],"followup":"They reply later: ‘I wasn't ready to talk.’","nextOptions":[["‘Understood. Could we agree on a simple way to say we need a break next time?’","Strong: creates a workable communication agreement.",true],["‘You should never need a break.’","People may legitimately need time to regulate.",false],["‘Next time I'll ignore you for longer.’","Retaliation escalates conflict.",false]]},{"title":"The fake certainty","category":"Truth & Evidence","setup":"A person claims to know another individual's motives based only on a short social media post.","options":[["‘What evidence supports that interpretation? Could there be another explanation?’","Strong: encourages justified confidence and alternatives.",true],["‘That proves they have a personality disorder.’","You cannot diagnose someone from a post.",false],["‘Let's spread the claim to make them admit it.’","Public pressure and rumor are not ethical fact-finding.",false]],"followup":"They answer: ‘I can just tell what kind of person they are.’","nextOptions":[["‘That may be your impression, but let's separate impressions from confirmed facts.’","Strong: recognizes perception without treating it as verified.",true],["‘Your intuition makes you an expert.’","Confidence is not a substitute for evidence.",false],["‘Then let's expose their private information.’","Private information should not be weaponized.",false]]},{"title":"The work disagreement","category":"Influence","setup":"A colleague dismisses your proposal without explaining why.","options":[["‘Which part concerns you most? I'd like to understand the trade-offs.’","Strong: you seek useful criteria before persuading.",true],["‘You'll regret not supporting me.’","Threatening consequences is coercive.",false],["‘I'll flatter you until you agree.’","Manipulative praise does not address the decision.",false]],"followup":"They say: ‘I worry the plan will cost too much.’","nextOptions":[["‘Let's compare expected costs, benefits, and a smaller pilot option.’","Strong: shared evidence and alternatives support informed choice.",true],["‘You are too negative to understand.’","An insult sidesteps the concern.",false],["‘I'll hide the costs until after approval.’","Concealing material information is deceptive.",false]]}];
const labDepth=[{"setting":"A friend recounts an event differently on two occasions. Your goal is to establish a reliable timeline without assuming a motive.","opening":"You: ‘Last week you said the meeting was Monday. Today you said Wednesday. I'm trying to understand the timeline.’","reactions":["Other person: ‘I might have mixed up two appointments. Let me think.’","Other person: ‘Why are you calling me a liar? I don't want to discuss this.’","Other person: ‘My face has nothing to do with the date. You're making assumptions.’"],"nextReactions":["Other person: ‘I found two calendar entries. One was a planning call on Monday; the meeting was Wednesday.’","Other person: ‘I don't have to prove every detail to you.’","Other person: ‘Threatening to tell people about me isn't okay. I'm ending this conversation.’"],"closing":"A calendar shows a planning call Monday and a meeting Wednesday. What is the strongest conclusion?","choices":[["‘The two dates may refer to different events; let's check the original claim.’","This conclusion fits the records while leaving room for clarification.",true],["‘The contradiction proves intentional deception.’","Different dates alone cannot establish deliberate lying.",false],["‘There is no point checking records.’","Available records can clarify a timeline even when motives remain unknown.",false]],"mechanism":"A contradiction is a signal to ask a clarifying question, not a reliable lie detector. Stress and accusation can make recollection harder and increase defensiveness.","alternative":"The person may have confused two appointments, remembered poorly, spoken imprecisely, or intentionally misled. Records can narrow the possibilities.","evidence":"Compare complete messages, event invitations, calendar entries, and the exact wording of each claim. A record of two events may reconcile the accounts.","lesson":"A strong investigation can end with uncertainty. Precision about what you know is more valuable than extracting agreement."},{"setting":"Someone frames your decision as proof of affection. You want to preserve a real choice while recognizing their disappointment.","opening":"Other person: ‘If you cared about me, you'd agree right now.’","reactions":["Other person: ‘I just don't want to feel unimportant to you.’","Other person: ‘Fine, I knew you'd give in eventually.’","Other person: ‘You can't just throw that accusation back at me.’"],"nextReactions":["Other person: ‘Tomorrow is fine, but please actually follow up.’","Other person: ‘You're trying to punish me by making me wait.’","Other person: ‘Are you agreeing because you want to or because I pushed you?’"],"closing":"The request is still on the table. What response best protects a genuine decision?","choices":[["‘I'll decide after reviewing what you're asking, and I'll tell you when.’","A clear decision process separates affection from compliance.",true],["‘I'll agree so you won't be disappointed.’","Avoiding disappointment is not the same as informed agreement.",false],["‘You must never feel upset about my decisions.’","You can set limits on pressure without controlling another person's feelings.",false]],"mechanism":"Guilt-based pressure can replace evaluation of a request with a fear of seeming uncaring. This makes compliance feel like a relationship obligation.","alternative":"The other person might be anxious or expressing real hurt, rather than calculating a tactic. Repeated disregard for your decision process is more informative than one statement.","evidence":"Observe whether they accept a reasonable timeframe and a possible no. Notice whether threats or punishments follow disagreement.","lesson":"A relationship can include disappointment without requiring surrender of autonomy."},{"setting":"A promise was missed. You need a concrete answer, but the discussion has shifted to unrelated complaints.","opening":"You: ‘We agreed you'd call the landlord. Did you get a chance to do it?’","reactions":["Other person: ‘No, and I know you're upset. But I've also felt criticized lately.’","Other person: ‘Why do you always act like I'm the problem?’","Other person: ‘Don't threaten me with personal information.’"],"nextReactions":["Other person: ‘Okay. I didn't call. Can we talk about the criticism after we make a plan?’","Other person: ‘You only care about your own problems.’","Other person: ‘That ultimatum isn't helping either of us.’"],"closing":"Both parties have concerns. Which plan best addresses them?","choices":[["‘Let's make the landlord call plan, then set time for your concern.’","Two separate issues can both receive attention without becoming conditions for one another.",true],["‘Your complaint doesn't matter at all.’","Dismissal can escalate conflict and prevent mutual accountability.",false],["‘We should argue until someone admits total fault.’","A forced winner/loser frame rarely resolves the practical issue.",false]],"mechanism":"Counteraccusations consume attention and can derail a verifiable question. They can also reveal a genuine second problem.","alternative":"The person may be evading responsibility, feeling attacked, or raising a legitimate issue poorly.","evidence":"Track whether the original commitment is eventually acknowledged and acted on; separately assess the other complaint.","lesson":"The goal is not to prove one person is entirely wrong. It is to resolve each issue without losing the thread."},{"setting":"A disagreement at a meeting turns personal. You want to protect the discussion without retaliating.","opening":"Colleague: ‘That idea is ridiculous. Do you even understand this job?’","reactions":["Colleague: ‘Fine. My concern is the cost estimate.’","Colleague: ‘You can't take a joke.’","Colleague: ‘Now you're insulting me in front of everyone.’"],"nextReactions":["Colleague: ‘We could compare the estimates after the meeting.’","Colleague: ‘You're making a big deal out of nothing.’","Colleague: ‘This is getting out of hand.’"],"closing":"What is a constructive next move in a workplace meeting?","choices":[["‘Let's review the figures and keep feedback focused on the proposal.’","A task-focused request protects the decision process.",true],["‘I'll publicly mock them next time.’","Retaliation creates another problem rather than correcting this one.",false],["‘I'll never offer another idea.’","Withdrawal may unnecessarily sacrifice your legitimate participation.",false]],"mechanism":"Personal attacks shift the discussion from evidence to status and self-defense, often increasing emotional escalation.","alternative":"The speaker may be frustrated or attempting humor, but the impact on the meeting still matters.","evidence":"Distinguish the personal remark from any substantive criticism of the proposal; document repeated workplace incidents if needed.","lesson":"You can reject an insult without needing to humiliate the other person."},{"setting":"A costly proposal comes with an immediate deadline and an appeal to loyalty.","opening":"Other person: ‘Pay tonight or prove you don't trust me.’","reactions":["Other person: ‘But I really need an answer quickly.’","Other person: ‘Good. I'll send the payment link now.’","Other person: ‘Why are you making up stories to avoid helping?’"],"nextReactions":["Other person: ‘The seller says the offer ends tomorrow. I can show you the terms.’","Other person: ‘Then I guess you aren't serious.’","Other person: ‘Threatening me won't change the deadline.’"],"closing":"The seller's terms are available, but you still lack the complete cost breakdown. What next?","choices":[["‘I need the full terms and cost before agreeing, even if the offer expires.’","An informed choice can include walking away from a deadline.",true],["‘I'll pay because I don't want to lose approval.’","Social pressure is not evidence that the deal is sound.",false],["‘I'll hide my concerns and agree anyway.’","Concealing concerns does not resolve them.",false]],"mechanism":"Artificial scarcity and social approval can reduce deliberation. Real deadlines can exist, but they should be verifiable.","alternative":"The deadline might be legitimate and the person might genuinely feel stressed. That does not remove your need for information.","evidence":"Check the seller's independent terms, payment destination, refund policy, and total costs before committing.","lesson":"Pressure does not create a duty to accept a financial risk."},{"setting":"Two friends remember a conversation differently. Neither has a recording or written agreement.","opening":"Friend: ‘You promised to help on Saturday.’ You remember only saying you would try.","reactions":["Friend: ‘Maybe we understood the word “try” differently.’","Friend: ‘So you're saying my memory is worthless?’","Friend: ‘Please don't accuse me of gaslighting.’"],"nextReactions":["Friend: ‘We may not settle the past. Can we make the next plan clear?’","Friend: ‘I don't want to be interrogated about my memory.’","Friend: ‘No evidence doesn't mean I'm guilty.’"],"closing":"The original wording cannot be verified. What conclusion is justified?","choices":[["‘We remember it differently; let's make future commitments explicit.’","This respects uncertainty and improves future communication.",true],["‘My memory must be the correct one.’","Confidence does not guarantee accuracy.",false],["‘The lack of a recording proves bad intent.’","Missing evidence cannot establish motive.",false]],"mechanism":"Memory is reconstructive, and people can sincerely interpret tentative language differently.","alternative":"There could have been an actual promise, a tentative offer, or a misunderstanding.","evidence":"Seek contemporaneous notes if they exist, but accept that some past details remain unresolved.","lesson":"A fair conclusion can be ‘unknown’ rather than choosing a winner."},{"setting":"A set of requirements changes every time you satisfy the previous version.","opening":"You: ‘I completed the agreed checklist.’ Other person: ‘Now I need three more things.’","reactions":["Other person: ‘The project changed and I should have told you sooner.’","Other person: ‘You don't appreciate how hard my job is.’","Other person: ‘Changing the rules back won't help.’"],"nextReactions":["Other person: ‘Let's write down the new scope and deadline.’","Other person: ‘I don't know why you need everything in writing.’","Other person: ‘I never said you had to accept all of it.’"],"closing":"You have the old checklist and a proposed new scope. What should happen?","choices":[["‘Let's document the changes, reasons, and whether I agree to them.’","Clear scope helps distinguish necessary revisions from moving goalposts.",true],["‘No requirement can ever change.’","Legitimate circumstances sometimes require revision.",false],["‘I'll quietly stop working without explaining.’","Uncommunicated withdrawal can create further confusion.",false]],"mechanism":"Repeatedly changing success criteria can prevent closure and keep someone seeking approval or doing unpaid work.","alternative":"A legitimate new requirement may arise from changed circumstances; transparency and consent matter.","evidence":"Compare dated agreements, completed work, change requests, and who approved the revised scope.","lesson":"The best test is whether expectations can be clearly stated and negotiated."},{"setting":"Someone alleges wrongdoing but refuses to say what event they mean.","opening":"Other person: ‘Everybody knows what you did.’","reactions":["Other person: ‘I heard something, but I don't know the details.’","Other person: ‘Stop pretending you don't know.’","Other person: ‘Don't pressure me to accuse you of something.’"],"nextReactions":["Other person: ‘I need to check what was actually said before repeating it.’","Other person: ‘You're just trying to avoid responsibility.’","Other person: ‘I can't give you any specifics.’"],"closing":"The allegation remains vague. Which response best preserves accuracy?","choices":[["‘If you have a specific claim and evidence, I'll address it; I won't guess.’","Undefined allegations cannot be meaningfully evaluated.",true],["‘I'll admit whatever people think happened.’","A pressured admission may be false and is not fact-finding.",false],["‘I'll spread rumors about the accuser too.’","Retaliation compounds uncertainty and harm.",false]],"mechanism":"Vague claims can create anxiety and pressure a person to defend against unspecified accusations.","alternative":"The speaker might have incomplete information or be reluctant to share a source.","evidence":"Request the exact allegation, relevant date, and first-hand source; do not invent missing details.","lesson":"An accusation needs a specific proposition before it can be tested."},{"setting":"An apology for an insult is followed by an explanation that places responsibility on your reaction.","opening":"Other person: ‘Sorry I shouted, but you made me do it by asking that question.’","reactions":["Other person: ‘I was upset, but I shouldn't have shouted.’","Other person: ‘So my feelings don't count?’","Other person: ‘Now you're blaming me for everything.’"],"nextReactions":["Other person: ‘Next time I'll ask for a break before raising my voice.’","Other person: ‘I still think you provoked it.’","Other person: ‘This is turning into another argument.’"],"closing":"How can you evaluate whether repair is meaningful?","choices":[["‘Let's look for a specific change in how we handle the next disagreement.’","Behavioral follow-through matters more than a perfect apology script.",true],["‘One apology guarantees the problem is solved.’","Words alone cannot establish a lasting change.",false],["‘No one can ever be forgiven for raising their voice.’","Absolute rules may ignore context, safety, and genuine repair.",false]],"mechanism":"A conditional apology can appear to acknowledge harm while relocating responsibility for the harmful act.","alternative":"Someone can be sincerely remorseful and still express their own frustration poorly.","evidence":"Observe whether they take responsibility without coercion and whether the behavior changes over time.","lesson":"Accountability and mutual discussion can coexist."},{"setting":"A person goes quiet after conflict. You do not know whether they are overwhelmed or trying to punish you.","opening":"You: ‘Can we talk about yesterday?’ They do not respond until the following day.","reactions":["Other person: ‘I was overwhelmed and needed space.’","Other person: ‘You kept messaging me. I needed you to stop.’","Other person: ‘I didn't know how to respond.’"],"nextReactions":["Other person: ‘I can send a short message next time saying I need a day.’","Other person: ‘I don't want to promise a time when I'm upset.’","Other person: ‘Thanks for asking instead of assuming.’"],"closing":"What would best distinguish a healthy pause from a harmful recurring pattern?","choices":[["‘Let's agree on a safe, realistic way to signal a break and return.’","Mutual expectations provide more information than guessing intent.",true],["‘Silence always proves deliberate punishment.’","Silence can have many explanations.",false],["‘I'll send repeated messages until they reply.’","Repeated unwanted contact can cross boundaries.",false]],"mechanism":"Withdrawal may reduce emotional overload, but unexplained and repeated silence can also create anxiety and power imbalance.","alternative":"Overwhelm, safety needs, avoidance, or punishment are different possibilities.","evidence":"Look for communicated boundaries, patterns over time, and willingness to reconnect when safe.","lesson":"Respect space while deciding what communication reliability you need."},{"setting":"A person makes a confident claim about someone's hidden motives from a short online post.","opening":"Other person: ‘That post proves they're a manipulator.’","reactions":["Other person: ‘I guess I only saw a small part of the story.’","Other person: ‘It's obvious. Anyone can see it.’","Other person: ‘Why are you trying to protect them?’"],"nextReactions":["Other person: ‘We could look at the full context before deciding.’","Other person: ‘My intuition is usually right.’","Other person: ‘I don't have any more evidence.’"],"closing":"What can reasonably be concluded from the single post?","choices":[["‘It may raise questions, but we can't infer a diagnosis or hidden motive from it.’","This separates observations from speculation.",true],["‘A confident interpretation is as good as proof.’","Certainty is not evidence.",false],["‘Let's expose their private life until they confess.’","Harassment and privacy invasion are inappropriate and unreliable.",false]],"mechanism":"People readily infer intentions from limited cues and then seek confirming examples.","alternative":"The post could be joking, incomplete, quoted, edited, or genuine; context changes interpretation.","evidence":"Review original context, corroboration, and competing explanations before making claims.","lesson":"Psychological concepts are explanatory tools, not labels to apply to strangers from fragments."},{"setting":"A colleague dismisses your proposal, but the actual objection is not yet clear.","opening":"Colleague: ‘This plan won't work.’","reactions":["Colleague: ‘I'm worried the initial cost is too high.’","Colleague: ‘Why are you making me defend every detail?’","Colleague: ‘That isn't a fair way to discuss a proposal.’"],"nextReactions":["Colleague: ‘A limited pilot could answer the cost question.’","Colleague: ‘I still don't see enough evidence.’","Colleague: ‘We need a better way to evaluate it.’"],"closing":"You can run a low-cost pilot but cannot guarantee success. What proposal is strongest?","choices":[["‘Let's define a small pilot, measurable criteria, and a stop condition.’","Transparent trade-offs and measurable outcomes support informed decisions.",true],["‘I'll conceal the uncertain costs until they approve.’","Withholding material information undermines ethical persuasion.",false],["‘They must agree because I worked hard on it.’","Effort alone is not a decision criterion.",false]],"mechanism":"Persuasion is strongest when it addresses the other person's actual concerns with verifiable trade-offs.","alternative":"A colleague's resistance may reflect a legitimate risk assessment, competing priorities, or insufficient explanation.","evidence":"Compare costs, alternatives, expected outcomes, and measurable pilot criteria.","lesson":"Effective influence makes it easier to decide accurately, not harder to refuse."}];
const guides=[{"title":"When they change the story","say":"‘I heard two different versions. Can you help me understand the timeline?’","why":"Clarifies a discrepancy without assuming deception."},{"title":"When they blame you for asking","say":"‘I'm asking about this specific issue. We can discuss other concerns afterward.’","why":"Returns the conversation to the topic."},{"title":"When they insult you","say":"‘I'll continue when we can speak without insults.’","why":"Sets a boundary under your control."},{"title":"When they demand an immediate answer","say":"‘I'm not making this decision under pressure. I'll respond after I've considered it.’","why":"Protects informed choice."},{"title":"When they deny your recollection","say":"‘We remember this differently. Let's check what can actually be verified.’","why":"Separates memory disputes from documented facts."},{"title":"When the conversation becomes circular","say":"‘We're repeating the same points. I'm going to pause this conversation.’","why":"Prevents an unproductive loop."},{"title":"When someone uses guilt","say":"‘I care about your feelings. I still need to choose what works for me.’","why":"Separates empathy from automatic compliance."},{"title":"When your boundary is ignored","say":"‘I've said no. If this continues, I'll leave this conversation.’","why":"States an action under your control."},{"title":"When someone mocks your concern","say":"‘This matters to me. If we can't discuss it respectfully, I'll pause.’","why":"Keeps the focus on respect."},{"title":"When a disagreement gets personal","say":"‘Can we focus on the decision rather than criticizing each other?’","why":"Redirects from identity attacks to the issue."},{"title":"When someone claims everyone agrees","say":"‘I'd like to discuss the facts directly rather than unnamed opinions.’","why":"Avoids pressure from unverifiable social consensus."},{"title":"When a new requirement appears","say":"‘Can we agree on clear expectations before I continue?’","why":"Clarifies changing standards."},{"title":"When you need to verify a claim","say":"‘What source supports that? Let's check it together.’","why":"Invites shared evidence."},{"title":"When an apology comes with blame","say":"‘I appreciate the apology. I also want to talk about the specific behavior.’","why":"Keeps accountability clear."},{"title":"When someone assumes your intentions","say":"‘I understand the impact. Can I explain what I intended?’","why":"Distinguishes intention from impact."},{"title":"When you need time","say":"‘I won't make this decision today. I'll revisit it after I've thought it through.’","why":"Reinforces the right to deliberate."},{"title":"When silence follows conflict","say":"‘I can respect a break. Let's agree when to check in again.’","why":"Respects space while seeking clarity."},{"title":"When you're being pressured publicly","say":"‘I'd rather talk about this privately when we're both ready.’","why":"Moves away from social pressure."},{"title":"When the conversation feels unsafe","say":"‘I'm ending this conversation now.’","why":"Prioritizes disengagement over winning."},{"title":"When you're asked for a confession","say":"‘I won't agree to something I don't believe happened. Let's review the evidence.’","why":"Prevents pressured false admissions."},{"title":"When you notice a pattern","say":"‘This has happened several times. I'd like to discuss one concrete example.’","why":"Uses specific examples instead of labels."}];

function renderCitedText(content,references){return escapeHTML(content).replace(/\[([^\]\n]{2,140})\]/g,(whole,group)=>{const parts=group.split(";").map(p=>p.trim()).filter(Boolean);const found=parts.map(id=>(references||[]).find(r=>r.id===id));if(!parts.length||found.some(r=>!r||!/^https:\/\//.test(r.url)))return whole;return '<span class="inline-citations">'+found.map(r=>'<a class="source-link" href="'+escapeHTML(r.url)+'" target="_blank" rel="noopener noreferrer" title="'+escapeHTML(r.title)+'">'+escapeHTML(r.id)+' ↗</a>').join(" · ")+'</span>';});}
function renderIntegratedCase(c){if(!c)return "";return '<section class="integrated-case"><div class="mini">CONNECTED CASE STUDY · FICTIONAL</div><h3>'+escapeHTML(c.title)+'</h3><h4>What happened</h4><p>'+escapeHTML(c.scene)+'</p><h4>Psychology behind the interaction</h4><p>'+escapeHTML(c.mechanism)+'</p><h4>Possible effects on the other person</h4><p>'+escapeHTML(c.impact)+'</p><h4>Other plausible explanations</h4><p>'+escapeHTML(c.alternatives)+'</p><h4>Practical response and reasoning</h4><p>'+escapeHTML(c.response)+'</p><h4>Limits and safety considerations</h4><p>'+escapeHTML(c.boundary)+'</p><div class="related-sources"><strong>Sources related to this analysis</strong><ul>'+c.sources.map(r=>'<li><a href="'+escapeHTML(r.url)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(r.title)+' ↗</a></li>').join("")+'</ul></div></section>'}
