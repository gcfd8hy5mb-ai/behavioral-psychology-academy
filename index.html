<script>
const nav=[["home","⌂","Overview"],["learn","◫","Short Lessons"],["patterns","◇","Recognize Patterns"],["practice","▤","Conversation Lab"],["guide","☷","Quick Response Guide"],["journal","✎","Reflection Journal"]];
const lessons=[{"title":"Narcissistic traits: the full behavioral picture","category":"Personality & motivations","time":"18–25 min","sections":[["Understanding the concept","Narcissism describes a range of tendencies involving self-importance, a desire for recognition, status concerns, entitlement, and sometimes limited responsiveness to others' needs. Grandiose expression may appear confident, dominant, and attention-seeking. Vulnerable expression may appear easily shamed, resentful, and highly reactive to perceived slights. A person can show some traits without meeting criteria for narcissistic personality disorder (NPD), a clinical diagnosis."],["Possible psychological drivers","Researchers consider multiple interacting possibilities: temperament, learned ways of protecting self-esteem, sensitivity to status, social reinforcement, and problems regulating shame or criticism. There is no single proven childhood story or universal hidden insecurity that explains every person. The same visible action can emerge from different motivations."],["How conversations develop","Example: You ask why a promise was broken. They hear the question as an attack on competence, respond with an insult, and redirect attention to how you asked. The observable sequence is: concern raised → defensive interpretation → counterattack → original issue left unresolved. You can analyze that sequence without claiming to know their inner thoughts."],["Patterns over time","Look at specific actions: Do they acknowledge mistakes? Can they tolerate disagreement? Do standards apply equally to both people? Are apologies followed by changed behavior? Are they respectful when they don't get their way? One tense exchange is less informative than repeated behavior across different contexts."],["Common analytical mistakes","Do not infer NPD from social media, confidence, infidelity, arrogance, or one disagreement. Do not treat every apology as manipulation or every defensive reaction as proof of a secret motive. A diagnosis cannot reliably be made from a checklist applied to an absent third party."],["Response strategies","Identify a single observable issue, make a clear request, and watch whether the person can engage with it. Example: ‘We agreed on Friday. It didn't happen. What can we realistically agree on now?’ If the reply becomes insulting, you can end the discussion rather than fight about labels."],["Case breakdown","Statement: ‘You're attacking me by asking about the money.’ Observation: The speaker interprets a request for accounting as an attack. Unknown: whether this is deliberate diversion, genuine hurt, fear, or confusion. Useful next question: ‘Which part of the question felt attacking? I still need to review the amounts.’ Outcome to evaluate: whether specific figures are eventually provided."],["Practice challenge","Create a four-column note: exact words/actions; contextual facts; at least two possible explanations; your next verifiable question. Then explain what evidence would change your interpretation."]],"example":{"scene":"A promise becomes an argument","dialogue":[["You","We agreed you would handle that on Friday. What happened?"],["Other person","You always make me look incompetent. Nothing I do is good enough."],["You","I'm asking about Friday. Is there a way we can resolve it now?"]],"analysis":"The concrete question is replaced by a debate about criticism. This could reflect defensiveness, sensitivity to criticism, or purposeful diversion; the dialogue alone cannot establish a diagnosis or motive.","options":"A useful next step is to check whether the person can return to the original issue, acknowledge a concrete mistake, and agree on a realistic action."}},{"title":"Blame-shifting: mechanisms and counter-moves","category":"Manipulation analysis","time":"15–20 min","sections":[["Core mechanism","Blame-shifting redirects accountability for a specific action onto another person or issue. It can involve counteraccusations, irrelevant grievances, exaggerating the questioner's tone, or insisting the discussion cannot proceed until the questioner apologizes."],["Why it can work","Arguments have limited attention and emotional bandwidth. A counteraccusation creates a competing issue, potentially forcing the first person to defend themselves and abandoning the original question. That is an effect of the tactic, not proof of the other person's intention."],["Typical sequence","You ask why a bill wasn't paid → ‘You never appreciate me’ → you defend how appreciative you are → the bill is no longer discussed. The issue has moved from a verifiable payment to a broad evaluation of character."],["Distinguish real accountability","Sometimes both people have valid complaints. A fair response acknowledges that without making each issue conditional on the other. Two separate issues can both be addressed."],["Useful response structure","Use a three-part reply: acknowledge, refocus, specify. ‘I hear that you feel unappreciated. I will discuss that. First, was the bill paid on Tuesday, and if not, what happened?’"],["When to stop","If each specific question triggers new insults or threats, repeating it endlessly is not productive. Make a record of the unresolved issue and choose a time, format, or level of contact that protects your boundaries."],["Case breakdown","Claim: ‘You're only asking because you're controlling.’ Evidence: A question about a missed deadline, but no proof about motive. Interpretations: actual over-monitoring, defensiveness, distraction, or mixed motivations. Next move: clarify the deadline and separately invite feedback about communication."],["Practice challenge","Write two versions of an answer to ‘You do things wrong too!’: one that escalates and one that preserves both people's accountability. Explain the likely difference."]],"example":{"scene":"The unpaid bill","dialogue":[["You","Was the electric bill paid yesterday?"],["Other person","You never appreciate anything I do around here."],["You","We can discuss that concern separately. Was the bill paid?"]],"analysis":"The second statement introduces a broad complaint rather than answering the yes/no payment question. It might be a genuine grievance, but it does not resolve the bill.","options":"Keep the immediate question specific, verify whether payment occurred, and address other concerns as a separate conversation."}},{"title":"Gaslighting, memory, and reality testing","category":"Manipulation analysis","time":"18–25 min","sections":[["Definition and scope","Gaslighting commonly describes sustained attempts to undermine a person's trust in their own memory, judgment, or perception. Repeated denial of documented events may be part of this pattern. The label is not interchangeable with lying, disagreement, forgetting, or ordinary defensiveness."],["How the dynamic can operate","When a person repeatedly dismisses observations as irrational or impossible, the recipient may begin relying on that person's version of events over their own. Repetition, isolation, power differences, and selective reinforcement can increase confusion. These mechanisms are possibilities, not definitive readings of a stranger's intentions."],["Memory has limits","Human recollection is reconstructive. Confidence and vividness do not guarantee accuracy. Two sincere witnesses can remember different details. Keep separate the things you saw, the things you inferred, and the things a source can independently corroborate."],["Evidence ladder","Prefer primary records where available: dated messages, contemporaneous notes, transaction entries, or mutually agreed written plans. Check authenticity, completeness, and context. A screenshot can omit preceding conversation; a timestamp can be misunderstood."],["How to question a discrepancy","Say: ‘On Tuesday we agreed to 3 p.m.; I have that in the message. Today you're saying we agreed to 5 p.m. How do you understand the difference?’ This does not require declaring a lie or negotiating your own memory away."],["What not to do","Avoid endless argument over unprovable details, using surveillance to catch the person, or using labels as evidence. Do not assume a disagreement itself constitutes abuse."],["Case breakdown","Person A recalls a promise; Person B denies it; a message contains ‘I'll try.’ It supports an intention to attempt, not necessarily a firm commitment. The correct conclusion is more limited than either party's certainty."],["Practice challenge","Take a fictional disputed conversation and sort each statement into verified fact, witness recollection, interpretation, and unknown. Explain how you would update your conclusion if a full transcript appeared."]],"example":{"scene":"Two memories of one agreement","dialogue":[["You","The message says we planned to meet at 3."],["Other person","That never happened. You're imagining things."],["You","Let's look at the full conversation and see where we understood things differently."]],"analysis":"The dismissal can undermine confidence in memory, but one disagreement is insufficient to infer a sustained gaslighting pattern. A complete message thread might show ambiguity or missing context.","options":"Review complete records where appropriate; distinguish what is documented, remembered, and inferred."}},{"title":"Truth-seeking and evidence-based questioning","category":"Credibility & interviewing","time":"20–30 min","sections":[["Your objective","A reliable conversation collects information; it is not a contest to provoke a confession. People can misremember, omit context, feel embarrassed, misunderstand a question, or deliberately mislead. No single cue identifies which explanation is true."],["Open before narrow","Start with a broad invitation: ‘Walk me through what happened from the beginning.’ Then ask neutral clarifiers: ‘What happened next?’ and ‘What makes you sure of the time?’ Move to particular inconsistencies only after gathering the account."],["Construct a timeline","Record stated sequence, times, participants, sources, and uncertainties. Mark independently supported details differently from uncorroborated claims. Different accounts may conflict about one detail while agreeing about others."],["Test alternatives fairly","For each contradiction, ask what could explain it besides dishonesty: poor memory, ambiguous wording, time zone confusion, different reference events, missing records, or deliberate omission. Seek information that could disconfirm your favorite hypothesis."],["Why pressure can backfire","Accusations, repeated demands, humiliation, and threats can contaminate accounts and increase compliance rather than accuracy. A person may say something to end the pressure. Nervousness, gaze, posture, and speech style are weak standalone lie indicators."],["Practical question sequence","‘What happened?’ → ‘Who else was involved?’ → ‘What documents or messages might confirm that?’ → ‘Earlier you said Monday; later Wednesday. Can you explain the discrepancy?’ → ‘What do we still not know?’"],["Case breakdown","A person says ‘I sent the form Friday.’ Their sent folder shows an email drafted Friday and transmitted Monday. The verifiable claim is transmission Monday. Ask whether they meant preparing rather than sending; preserve both records before concluding intent."],["Practice challenge","Write an eight-question neutral interview for a fictional billing dispute, followed by a short report identifying three supported facts and three unknowns."]],"example":{"scene":"The changed timeline","dialogue":[["You","Can you walk me through the events from the beginning?"],["Other person","I sent it Friday, or maybe Monday. I don't remember."],["You","What records could confirm when it was actually sent?"]],"analysis":"A discrepancy creates a question, not proof of a lie. The answer may reflect an honest memory error, confusion between drafting and sending, or a misleading account.","options":"Ask open-ended questions first, then seek independent records rather than treating nervousness as evidence."}},{"title":"Boundaries, power, and conflict strategy","category":"Response strategy","time":"15–20 min","sections":[["Boundary versus control","A boundary describes what you will do with your own participation: ‘I won't continue a conversation with shouting.’ A controlling demand tries to dictate the other person's feelings, relationships, or choices. Boundaries work best when specific and realistic."],["Recognize escalation loops","Criticism → defensiveness → counterattack → louder criticism can become self-reinforcing. The goal is not to win the emotional contest but to end unproductive escalation while preserving the underlying issue."],["Choose your objective","Before responding, decide whether you need information, a decision, accountability, repair, or disengagement. Different goals require different wording; trying to obtain all of them in one argument may fail."],["Three levels of response","Level 1: clarify: ‘What exactly are you asking for?’ Level 2: assert: ‘I won't agree under pressure.’ Level 3: disengage: ‘I'm leaving this conversation now.’ Escalate your boundary only as needed for safety and clarity."],["Situational awareness","Power imbalances, shared finances, dependency, and threats matter. In coercive or abusive situations, direct confrontation may increase risk. Prioritize safety planning and trusted outside support instead of testing verbal techniques."],["Case breakdown","A colleague mocks you during a meeting. You calmly say, ‘Let's address the numbers.’ If they persist, you request that the meeting chair keep discussion professional or follow up through appropriate workplace channels. You need not insult them back."],["Practical script","‘I want to resolve the payment issue. I will discuss it respectfully. If insults continue, I'll pause and send the details in writing.’ This states objective, expectation, and a consequence you control."],["Practice challenge","For three fictional scenarios—interrupted meeting, repeated unwanted request, escalating personal argument—write the objective, one sentence of boundary, and safe disengagement option."]],"example":{"scene":"An insult during disagreement","dialogue":[["Other person","You're too stupid to understand why I'm right."],["You","I'm willing to discuss the decision, not personal insults."],["Other person","You're being sensitive."],["You","I'm ending this discussion for now. We can return to the issue respectfully."]],"analysis":"The response identifies an unacceptable behavior and an action within your control. It does not require agreement from the other person.","options":"Where the conflict is threatening or coercive, focus on safety and support instead of trying to win a confrontation."}},{"title":"Persuasion versus psychological exploitation","category":"Influence & decision-making","time":"18–25 min","sections":[["Define the distinction","Persuasion offers reasons and a genuine choice. Exploitation uses asymmetries of information or vulnerabilities—such as fear, shame, dependence, or confusion—to pressure another person's decision. Influence is unavoidable in communication; the ethics depend heavily on accuracy, consent, methods, and consequences."],["How legitimate influence works","People respond to relevance, clarity, credible evidence, anticipated costs and benefits, and whether they feel understood. A persuasive message identifies the actual decision, gives truthful reasons, addresses objections, and accepts a possible no."],["Common exploitative mechanisms to recognize","Artificial urgency reduces reflection time. Guilt framing makes affection seem conditional on agreement. Isolation limits alternative perspectives. Selective evidence hides material facts. Repetition and intimidation can replace evaluation with compliance. Learning these mechanisms helps detect them, not reproduce them."],["The difference between power and effectiveness","Intimidating someone may secure short-term compliance while damaging trust and accuracy. Effective negotiation instead defines interests, explores alternatives, and clarifies the terms either side can refuse."],["A practical negotiation framework","State the shared problem; define your preferred outcome; ask about the other party's constraints; propose an option with transparent trade-offs; establish an honest timeline; document an agreement if reached."],["Worked example","Exploitative: ‘Agree tonight or you obviously don't respect me.’ Constructive: ‘I'd like us to decide by Friday because the reservation expires then. Can we compare the two options tomorrow?’ Both seek a decision; only one preserves the other's ability to evaluate it."],["Pressure audit","Ask: Is material information hidden? Is a threat implied? Can the person decline without retaliation? Are we exaggerating consequences or exploiting personal insecurities? Would the approach still feel fair if the roles were reversed?"],["Practice challenge","Rewrite a fictional high-pressure sales pitch into an honest proposal; identify the information the recipient would need to make a free decision."]],"example":{"scene":"A high-pressure decision","dialogue":[["Other person","If you trusted me, you'd agree right now."],["You","I need to understand the costs and consider the alternatives."],["Other person","So you're refusing to support me?"],["You","I haven't decided yet. I'll give you an answer after I've reviewed it."]],"analysis":"The request for immediate agreement is framed as a loyalty test. Ethical persuasion instead offers reasons, a real choice, and an opportunity to review the proposal.","options":"Ask for missing facts and realistic deadlines. A no remains an acceptable outcome."}}];
const patterns=[{"name":"Blame-shifting","category":"Conflict tactics","sign":"The original concern is redirected to alleged faults of the person raising it.","example":"You ask about an unkept agreement; the reply becomes a list of your unrelated mistakes.","response":"‘I can discuss my part too. Can we first finish this specific issue?’","note":"A defensive change of subject can be unintentional. Look for repeated patterns and context.","next":"Keep separate notes of each issue; handle them one at a time.","depth":{"definition":"Blame-shifting moves attention from an action that needs explanation to a different complaint or accusation. The key feature is not simply saying 'you did something too'; it is leaving the original issue unanswered. Both parties may have legitimate concerns, so analyze whether each is ever addressed.","mechanism":"One common sequence starts with a precise question, moves to a criticism of the questioner, and ends with the original subject forgotten. This can reduce immediate discomfort or accountability; the effect can occur even when the shift was not deliberate.","secondExample":"You: 'Did you pay the bill?' Them: 'You never thank me for anything.' You: 'I can discuss that too. Do we know if the bill was paid?'","comparison":"Compare: 'No, I forgot to pay it. Also, I felt unsupported this week.' This accepts the specific fact while introducing a second concern. It is different from never answering.","evaluation":"Record the original question, the actual answer given, and whether the issue was ultimately resolved. Avoid deciding intent based on one exchange."}},{"name":"Guilt-tripping","category":"Pressure tactics","sign":"Affection, loyalty, or morality is framed as requiring agreement.","example":"‘If you really cared about me, you'd do this immediately.’","response":"‘I care about you, and I still need to make my own decision.’","note":"Someone expressing genuine hurt is not automatically manipulating you.","next":"Consider the request on its merits, not solely on the fear of disappointing someone.","depth":{"definition":"Guilt-tripping uses another person's sense of duty, loyalty, or concern to press for a decision. It often turns a practical request into a test of whether someone is caring or good. The emotion itself is not evidence of a manipulative motive.","mechanism":"The pressure works because the recipient may want to avoid being seen as selfish. The conversation shifts from 'Is the request reasonable?' to 'How can I prove I care?' A clear distinction between emotional support and agreement helps restore choice.","secondExample":"Them: 'After everything I've done, you owe me this.' You: 'I appreciate the help you've given me, but I still need to evaluate this request separately.'","comparison":"Compare: 'I'm disappointed you can't come; I was looking forward to it.' That communicates a feeling without declaring that the other person must comply.","evaluation":"Examine whether disagreement is permitted, whether consequences are threatened, and whether the request can be considered freely."}},{"name":"DARVO","category":"Conflict tactics","sign":"Denial, attack, and reversal of victim and offender roles occur in a dispute.","example":"After a concern is raised, the discussion centers exclusively on how unfair it was to raise it.","response":"‘Let's return to what happened and examine each concern separately.’","note":"This framework is not a test of truthfulness or a diagnosis.","next":"Record factual claims and responses separately, without inferring guilt from the pattern.","depth":{"definition":"DARVO is a descriptive sequence: Deny, Attack, and Reverse Victim and Offender. A person accused of wrongdoing may reject the allegation, counterattack the accuser, and portray themselves as the injured party. The pattern is a way to organize a conversation—not a verdict.","mechanism":"In a conflict, the accusation and counteraccusation can quickly become entangled. Observers may start evaluating the accuser's tone or behavior instead of the original evidence. Either side can make inaccurate claims, so the actual event still needs independent examination.","secondExample":"You: 'The receipt shows a withdrawal I don't recognize.' Them: 'You're paranoid. You're the one harming this relationship by questioning me.' You: 'Let's review the transaction before discussing our feelings about the question.'","comparison":"Compare: 'I didn't make that withdrawal. Here's my transaction history. I also feel unfairly accused.' Denial and distress alone are not sufficient to establish DARVO.","evaluation":"Separate the original allegation, the denial, the counterclaim, and any available records. Judge each claim independently."}},{"name":"Gaslighting","category":"Reality & evidence","sign":"A repeated pattern of undermining another person's confidence in their memory or perception.","example":"Repeatedly denying documented events while insisting the other person cannot trust their own recollection.","response":"‘We disagree about this. I'm going to review the information available.’","note":"One disagreement, forgetfulness, or misunderstanding does not establish gaslighting.","next":"Seek neutral records and support if the pattern affects your well-being.","depth":{"definition":"Gaslighting refers to a pattern in which a person's trust in their own perceptions, memory, or judgment is undermined. The term is often used loosely; a single denial or difference in recollection does not establish an ongoing gaslighting dynamic.","mechanism":"Persistent invalidation can lead someone to second-guess themselves, especially when coupled with power differences, isolation, or selective evidence. But memories are fallible, and two people can sincerely remember different details. The analysis depends on repeated conduct and reliable context.","secondExample":"You: 'We agreed on Tuesday; I saved the message.' Them: 'You're making up things again. You can't trust your mind.' You: 'I have the full thread. Let's review what it actually says.'","comparison":"Compare: 'I remember Wednesday, not Tuesday. Can we check?' An ordinary disagreement invites verification rather than undermining the other's ability to think.","evaluation":"Look for repeated reality-denying statements, available corroboration, and whether the person can acknowledge clear evidence. If the situation is unsafe, prioritize support rather than confrontation."}},{"name":"Moving goalposts","category":"Pressure tactics","sign":"The standard for success keeps changing after prior requirements are satisfied.","example":"After you complete an agreed task, an unmentioned requirement is added repeatedly.","response":"‘What specific outcome are we agreeing to, and can we write it down?’","note":"Expectations can change for legitimate reasons; examine the explanation.","next":"Clarify scope and criteria before committing more time.","depth":{"definition":"Moving the goalposts means changing a success criterion after someone has worked to meet the previous criterion. A task may become impossible to complete because the definition of 'enough' keeps shifting.","mechanism":"Sometimes the change serves to retain control or keep someone seeking approval. At other times requirements genuinely evolve. The critical distinction is whether the changes are explained, mutually discussed, and realistically achievable.","secondExample":"You: 'I finished the three steps we agreed on.' Them: 'That doesn't count unless you also do five more things.' You: 'When did the requirements change? Can we agree on a final list?'","comparison":"Compare: 'The client added a safety requirement; here's why we need to update the checklist.' That is a documented revision, not necessarily manipulation.","evaluation":"Track original expectations, revisions, and whether the other person accepts any reasonable completion standard."}},{"name":"Provocation","category":"Conflict tactics","sign":"Personal insults or bait draw attention away from the underlying issue.","example":"A discussion of scheduling turns into insults about intelligence or character.","response":"‘I'm available to talk about the issue, not personal insults.’","note":"Frustration does not necessarily imply a deliberate manipulation strategy.","next":"Pause or disengage if the discussion becomes hostile.","depth":{"definition":"Provocation involves remarks or actions that draw someone into a strong emotional reaction, sometimes shifting attention from the original subject. Insults, sarcasm, and loaded accusations can derail otherwise solvable disputes.","mechanism":"Once anger becomes the focus, people often start defending their dignity rather than examining the issue. A reactive exchange can reinforce itself: insult, retaliation, escalation. The speaker may be deliberately baiting, frustrated, or unaware of the effect.","secondExample":"You: 'Can we discuss the missed deadline?' Them: 'You don't understand anything.' You: 'I'll discuss the deadline, but not personal insults.'","comparison":"Compare: 'I'm frustrated because the deadline was missed.' That expresses anger about an issue without attacking personal worth.","evaluation":"Focus on what was actually said, whether the pattern repeats, and when ending the conversation is safer than continuing."}},{"name":"Love bombing","category":"Relationship patterns","sign":"Very intense attention or affection appears early, sometimes alongside pressure for rapid commitment.","example":"Someone you've just met pushes for immediate major promises and resents slowing down.","response":"‘I enjoy getting to know you, but I'm taking this at my own pace.’","note":"High enthusiasm alone is not evidence of abuse or manipulation.","next":"Look at whether boundaries are respected over time.","depth":{"definition":"Love bombing describes unusually intense affection, attention, or promises that may be used to accelerate attachment or commitment. It becomes concerning when paired with pressure, boundary violations, isolation, or abrupt withdrawal of affection.","mechanism":"Rapid attention can feel validating and create a sense of obligation. When a person is pushed to commit before they have time to evaluate compatibility, they may find it harder to say no. Intense enthusiasm alone is not a reliable marker of manipulation.","secondExample":"Them: 'We just met, but if you really love me you'll move in this week.' You: 'I enjoy our connection, but I won't make a major commitment this quickly.'","comparison":"Compare: 'I'm excited about us, and I respect taking things slowly.' Strong feelings with respect for choice are not the same as coercion.","evaluation":"Evaluate how the person reacts to a reasonable no, rather than trying to infer intent from generous gifts or affectionate words alone."}},{"name":"Silent treatment versus taking space","category":"Relationship patterns","sign":"Unexplained withdrawal may be experienced as punitive, whereas a communicated break can be healthy.","example":"Someone disappears after every disagreement and refuses to say when discussion can resume.","response":"‘I respect needing space. Could we agree on when to check back in?’","note":"Silence can reflect overwhelm, safety needs, or many other factors.","next":"Avoid repeated unwanted contact; set your own expectations.","depth":{"definition":"Silence after conflict can have very different meanings. A communicated pause may help people calm down; prolonged, unexplained withdrawal used as punishment can become a harmful pattern.","mechanism":"An unannounced absence can create uncertainty and motivate someone to chase reassurance. Yet withdrawal can also result from overwhelm, fear, or a need for safety. The most useful information is what was agreed on and whether there is a reliable path to resume communication.","secondExample":"Them: 'I'm too upset to talk. Let's reconnect tomorrow.' This gives a clear pause. Contrast with repeated disappearing followed by demands that you apologize before contact resumes.","comparison":"Compare a consensual time-out with silence that is explicitly used to threaten, punish, or control. Do not assume either intention solely because a message went unanswered.","evaluation":"Respect requests for space and avoid repeated unwanted contact. Decide what communication pattern you can accept in the relationship."}},{"name":"Triangulation","category":"Relationship patterns","sign":"A third person's opinion or presence is used to apply pressure in a two-person dispute.","example":"‘Everyone agrees you're wrong,’ without identifying the specific concern.","response":"‘I'd prefer to discuss our disagreement directly and specifically.’","note":"Seeking mediation or outside support can be healthy.","next":"Do not recruit others into a retaliation cycle.","depth":{"definition":"Triangulation occurs when another person's opinion, attention, or presence is used to shape a dispute between two people. It may involve creating rivalry, quoting unnamed supporters, or communicating indirectly to increase pressure.","mechanism":"The third-party reference can make a person feel outnumbered or fearful of rejection. It also makes claims harder to verify when sources are vague. However, involving an impartial mediator or seeking support can be healthy and appropriate.","secondExample":"Them: 'Everyone thinks you're unreasonable.' You: 'Who has specific concerns, and what are they? I'd rather discuss our issue directly.'","comparison":"Compare: 'A neutral mediator could help us communicate safely.' This introduces a third person for structure, not leverage.","evaluation":"Separate verifiable third-party statements from vague claims about what 'everyone' believes. Avoid recruiting allies to retaliate."}},{"name":"Emotional blackmail","category":"Pressure tactics","sign":"Threats of withdrawal, punishment, or distress are used to demand compliance.","example":"‘If you don't do this, I'll ruin your reputation.’","response":"‘I won't make a decision under threats. I'm ending this conversation for now.’","note":"Some threats indicate serious safety risks, not merely poor communication.","next":"Preserve relevant evidence and seek qualified support if threatened.","depth":{"definition":"Emotional blackmail is pressure through threats, fear, obligation, or guilt. The person may imply that affection, reputation, support, or stability will be taken away unless another person complies.","mechanism":"The pressured person can begin making decisions to avoid punishment instead of choosing freely. The most serious forms can overlap with coercive control. Threats of self-harm must be taken seriously as safety concerns, not used as a bargaining exercise.","secondExample":"Them: 'If you don't give me the password, I'll tell people embarrassing things about you.' You: 'I won't share my password. I'm ending this exchange and keeping a record of the threat.'","comparison":"Compare: 'I'm upset and need some time to decide whether this relationship works.' Honest personal decisions are not automatically coercive threats.","evaluation":"Notice the demand, threatened consequence, power imbalance, and safety risk. Seek support for threats rather than trying to outmaneuver them."}},{"name":"False urgency","category":"Pressure tactics","sign":"Artificial deadlines attempt to bypass consideration and verification.","example":"‘You have five minutes to decide or you lose everything.’","response":"‘I won't agree without enough time to review the facts.’","note":"Real deadlines exist; verify them independently.","next":"Use an agreed decision window or decline.","depth":{"definition":"False urgency creates a rushed decision deadline that may not be justified by the facts. It narrows the time available to research alternatives, consult others, or evaluate consequences.","mechanism":"Scarcity and time pressure can influence attention and willingness to take risks. Actual deadlines do exist; the question is whether the deadline can be verified and whether important information is withheld.","secondExample":"Them: 'Transfer the money within ten minutes or lose your only chance.' You: 'I'll verify the terms independently before sending anything.'","comparison":"Compare: 'Registration closes Friday according to the published schedule.' An independently checkable deadline can be legitimate.","evaluation":"Ask who established the deadline, what evidence supports it, and what happens if you wait. Declining may be appropriate when pressure prevents informed consent."}},{"name":"Projection","category":"Thinking traps","sign":"A person attributes to someone else feelings or motives that may also be relevant to themselves.","example":"An argument repeatedly includes assumptions about your intent without evidence.","response":"‘What specific action are you referring to? Let's discuss that.’","note":"Projection is difficult to establish from outside; avoid mind-reading.","next":"Focus on observable conduct rather than assumed inner motives.","depth":{"definition":"Projection is a psychological concept in which someone attributes feelings, motives, or tendencies to another that may reflect their own experience. In everyday arguments, however, accusing someone of projection often amounts to guessing their internal state.","mechanism":"People routinely interpret others through their own assumptions, but an outside observer rarely has enough information to establish projection as a defense mechanism. A claim like 'you are jealous' needs supporting behavior, not a psychological label.","secondExample":"Them: 'You're only asking because you're trying to control me.' You: 'What action makes you think that? I'd like to discuss the specific request.'","comparison":"Compare: 'I feel controlled when you call repeatedly.' This describes an experience and an observable behavior without claiming hidden motives.","evaluation":"Focus on what happened and the effect it had, not an untestable theory about which person secretly feels what."}},{"name":"Stonewalling","category":"Conflict tactics","sign":"A person disengages from conversation in a way that prevents resolution.","example":"Every attempt to agree on next steps ends without a response or plan.","response":"‘Let's pause and agree on a specific time to revisit this.’","note":"Withdrawal may be protective, especially during conflict or abuse.","next":"You cannot force engagement; decide what boundaries you need.","depth":{"definition":"Stonewalling is a persistent refusal or inability to engage in a discussion that needs resolution. It may look like shutting down, changing subjects, or leaving without a plan to return.","mechanism":"Some people withdraw because they are flooded with emotion or trying to avoid conflict. Others may use refusal to prevent accountability. Those explanations require different responses, so pay attention to context and willingness to resume later.","secondExample":"You: 'Can we discuss the plan?' Them: 'I'm done.' You: 'I can pause. Would tomorrow at six work to finish this?'","comparison":"Compare: 'I need twenty minutes to calm down and then I'll come back.' A timed break can be constructive rather than stonewalling.","evaluation":"Look at whether the person returns, can identify limits, and engages when conditions are calmer. You cannot force a conversation."}},{"name":"Intermittent reinforcement","category":"Relationship patterns","sign":"Unpredictable rewarding and withholding may strengthen a difficult attachment.","example":"Warm reassurance is followed by unexplained withdrawal, repeated over time.","response":"‘I need consistency and clarity rather than unpredictable commitments.’","note":"Variability by itself does not establish malicious intent.","next":"Judge whether the overall relationship is reliable and safe.","depth":{"definition":"Intermittent reinforcement refers to rewards arriving unpredictably rather than consistently. In relationships, fluctuating attention, approval, or affection can make it difficult to anticipate what will happen next.","mechanism":"In learning psychology, variable reward schedules can support persistent behavior. Applying that model to complex relationships requires caution: inconsistent communication alone does not prove deliberate conditioning or explain every attachment.","secondExample":"One week someone makes big promises and is affectionate; the next they disappear without explanation. You ask whether there is a realistic, consistent commitment rather than trying to earn the return of affection.","comparison":"Compare: A partner who explains work-related unavailability and follows through on a revised plan may simply have an uneven schedule.","evaluation":"Evaluate consistency, mutual expectations, and your own well-being over time. Do not treat every fluctuating mood as a calculated strategy."}},{"name":"Minimization","category":"Reality & evidence","sign":"A harmful or consequential event is dismissed as insignificant.","example":"‘It was just a joke,’ after a repeated hurtful comment.","response":"‘Regardless of intent, I want to address the impact and what changes next.’","note":"People may sincerely perceive impact differently.","next":"Name the specific act and ask for concrete repair.","depth":{"definition":"Minimization occurs when the significance, impact, or seriousness of an event is downplayed. The conversation may move from 'what happened and how did it affect someone?' to whether the affected person is too sensitive.","mechanism":"People may minimize to avoid guilt, protect self-image, or because they genuinely perceive the event differently. Intent does not erase impact, but impact alone does not prove a malicious motive.","secondExample":"Them: 'It was only a joke; stop being dramatic.' You: 'I understand you meant it as humor. I don't want that comment repeated.'","comparison":"Compare: 'I didn't realize it hurt. I won't repeat it.' A response that recognizes impact is different from dismissing it.","evaluation":"Name the concrete behavior, describe its effect, and evaluate whether it changes. Do not get stuck proving how hurt you were."}},{"name":"Selective evidence","category":"Reality & evidence","sign":"Only supporting facts are presented while contrary information is ignored.","example":"A story cites one message but omits nearby messages that change its meaning.","response":"‘What information might challenge that interpretation?’","note":"Incomplete information can be accidental.","next":"Look for primary sources and missing context.","depth":{"definition":"Selective evidence means presenting information that supports one conclusion while leaving out relevant contradictory context. This can happen in arguments, news posts, business disputes, and personal conversations.","mechanism":"People naturally notice confirming information more readily, and some deliberately curate misleading excerpts. A screenshot or quote may be authentic while the impression it creates is false because the surrounding material is missing.","secondExample":"A person shows one message that sounds threatening; the full conversation reveals it was a quote from a fictional story. The correct interpretation changes when context is restored.","comparison":"Compare: A summary that discloses what it omits and links to the full record allows others to check the interpretation.","evaluation":"Ask for complete timelines and original sources. Search for evidence that could disconfirm your initial conclusion."}},{"name":"Mind-reading claims","category":"Thinking traps","sign":"Someone asserts certainty about another person's intentions without evidence.","example":"‘I know you did that to humiliate me,’ despite no direct statement of intent.","response":"‘I hear that's how it felt. Can we discuss what happened and what I intended?’","note":"Feelings and interpretations are real experiences but not proof of intent.","next":"Distinguish an action, its impact, and any inferred motive.","depth":{"definition":"Mind-reading claims state another person's intentions as if they were proven facts: 'You did that to embarrass me.' Intent is sometimes relevant, but it cannot usually be observed directly.","mechanism":"When people feel hurt, they often infer motive from impact. The inference can be understandable yet inaccurate. A productive discussion distinguishes the action, how it landed, and what the person intended.","secondExample":"Them: 'You ignored me on purpose.' You: 'I didn't see the message. I understand it felt dismissive; let's discuss how to avoid that.'","comparison":"Compare: 'I felt ignored when I didn't get a response.' That expresses an experience without asserting a hidden motive.","evaluation":"Ask what observable event supports the claim and what other explanations might fit. Acknowledge impact without agreeing to an unsupported intention."}},{"name":"Boundary testing","category":"Relationship patterns","sign":"Someone repeatedly challenges a plainly communicated limit.","example":"A person keeps pressuring you after you've declined a nonessential request.","response":"‘I've answered. If the pressure continues, I'll end the discussion.’","note":"An initial misunderstanding is not the same as repeated disregard.","next":"Choose consequences you can safely carry out yourself.","depth":{"definition":"Boundary testing refers to repeated challenges to an expressed limit, particularly after it has been clearly explained. It can include asking again and again, treating refusal as negotiable, or punishing someone for declining.","mechanism":"Some repeated requests arise from misunderstanding; others disregard autonomy. The important signal is what happens after the boundary becomes clear and whether the other person respects consequences you can control.","secondExample":"You: 'I don't share my phone password.' Them: 'If you loved me, you would.' You: 'My answer hasn't changed. I'm ending this discussion.'","comparison":"Compare: 'I didn't know that was your boundary; I won't ask again.' A respectful response shows adjustment rather than repeated pressure.","evaluation":"State the boundary plainly once, clarify if needed, then prioritize your own actions rather than trying to change the other's internal state."}},{"name":"Narcissistic traits vs. NPD","category":"Personality & behavior","sign":"Traits such as entitlement or heightened sensitivity to criticism exist on a continuum; NPD is a clinical diagnosis.","example":"A person becomes defensive when criticized and frequently asks for admiration.","response":"‘Let's discuss the specific behavior and how it affects us.’","note":"Neither isolated incidents nor a short online checklist can diagnose a personality disorder.","next":"Do not use clinical labels to win arguments.","depth":{"definition":"Narcissistic traits involve patterns such as entitlement, attention-seeking, or heightened concern with status and criticism. Narcissistic personality disorder (NPD) is a clinical diagnosis requiring evaluation of a pervasive pattern and functional impact.","mechanism":"There are multiple ways traits may appear, including outwardly grandiose presentation or more vulnerable, shame-sensitive responses. Researchers debate aspects of measurement and mechanisms. None of these descriptions allows you to diagnose someone based on a single argument.","secondExample":"At a team meeting, someone takes excessive credit and reacts badly to feedback. You can address attribution and professional standards without assigning a personality disorder.","comparison":"Compare: Someone proud of an achievement who still recognizes others' contributions and accepts criticism may be confident, not disordered.","evaluation":"Evaluate repeated conduct and consequences rather than trying to identify a secret 'narcissist' from snippets. A qualified clinician assesses diagnoses."}},{"name":"Coercive control warning signs","category":"Safety & boundaries","sign":"A pattern of intimidation, isolation, monitoring, or restrictions can erode another person's autonomy.","example":"Someone restricts your access to friends or money and threatens consequences for resisting.","response":"‘I need support and a safe way to evaluate my options.’","note":"This may be a safety issue; direct confrontation may increase danger.","next":"Prioritize safety and support from trusted people or qualified services.","depth":{"definition":"Coercive control is a pattern of conduct that restricts another person's autonomy through intimidation, isolation, monitoring, financial restrictions, threats, or similar measures. Unlike a single rude exchange, the concern is a broader system of power and constraint.","mechanism":"A person may become dependent on the controlling partner for money, housing, social connection, or a sense of safety. Risks can rise when autonomy is challenged, so direct confrontation and clever verbal tactics may be unsafe.","secondExample":"A partner demands access to every account, threatens to cut off money, and forbids contact with friends. Those combined actions merit serious attention to safety and support.","comparison":"Compare: Partners mutually agreeing on a budget or sharing account access voluntarily, without punishment for refusal, is not inherently coercive.","evaluation":"Consider safe ways to speak with trusted support or professional services. Do not use an app exercise as a substitute for an individualized safety plan."}},{"name":"Repair and accountability","category":"Healthy alternatives","sign":"A constructive response owns a specific action, acknowledges impact, and commits to change.","example":"‘I was wrong to raise my voice. I will pause next time instead.’","response":"‘Thank you for acknowledging it. What should we do differently next time?’","note":"A sincere apology matters, but consistent follow-through matters too.","next":"Track actions over time rather than relying only on words.","depth":{"definition":"Repair and accountability describe constructive alternatives to manipulation: recognizing a specific act, taking responsibility, understanding impact, making amends where possible, and changing future behavior.","mechanism":"A useful apology is specific rather than conditional. But words alone are not enough; improvement is shown through consistent follow-through. Both participants may need to repair different parts of the conflict.","secondExample":"Them: 'I raised my voice and interrupted you. That wasn't okay. Next time I'll take a break and return in twenty minutes.' You: 'I appreciate the plan. Let's see if that works.'","comparison":"Compare: 'I'm sorry you were upset, but you made me do it.' This may avoid responsibility by shifting it back to the recipient.","evaluation":"Assess whether a concrete change occurs over time. A meaningful repair process can include boundaries, mutual agreements, and outside assistance."}}];
const cases=[{"title":"The changed date","category":"Truth & Evidence","setup":"A person originally said an event happened on Monday. Today they say Wednesday. No independent evidence is available.","options":[["‘Can you walk me through the sequence so I understand what changed?’","Strong: you invite detail without presuming dishonesty.",true],["‘You contradicted yourself, so you're lying.’","An inconsistency alone does not establish a lie.",false],["‘Your nervous expression proves you are hiding something.’","Emotional and nonverbal cues are not dependable lie detectors.",false]],"followup":"They reply: ‘I was remembering a different appointment. I need to check my calendar.’","nextOptions":[["‘Please check it. We can revisit this when we know the date.’","Strong: checking an independent record is more reliable than escalating.",true],["‘You're just making excuses again.’","This dismisses a plausible explanation before it can be checked.",false],["‘Then I will tell everyone you are dishonest.’","Threats make a factual conversation less safe and reliable.",false]]},{"title":"The guilt test","category":"Boundaries","setup":"You say you need time to consider a request. Someone replies: ‘If you cared about me, you'd say yes now.’","options":[["‘I care about you, and I still need time to decide.’","Strong: you maintain both empathy and autonomy.",true],["‘Fine, I agree so you'll stop.’","A pressured yes may not reflect your decision.",false],["‘I'll make you feel guilty too.’","Retaliation reinforces an unhealthy dynamic.",false]],"followup":"They add: ‘So you're going to leave me waiting?’","nextOptions":[["‘I'll give you an answer tomorrow after I think it through.’","Strong: a clear, reasonable timeframe can reduce uncertainty without surrendering choice.",true],["‘You deserve to wait forever.’","Punishment is not a constructive boundary.",false],["‘I guess I must say yes now.’","You do not have to agree simply to stop pressure.",false]]},{"title":"The derailed conversation","category":"Accountability","setup":"You raise a specific broken promise. The other person begins listing unrelated mistakes you've made.","options":[["‘Those may matter too. Could we finish this issue first?’","Strong: acknowledges their concerns and keeps the conversation focused.",true],["‘You always manipulate everyone.’","Global labels invite argument rather than clarification.",false],["‘I'll use your secrets against you unless you answer.’","Exploitation and threats are harmful and unreliable.",false]],"followup":"They say: ‘My complaints are important too.’","nextOptions":[["‘They are. Let's agree to discuss both, one at a time.’","Strong: it preserves fairness and structure.",true],["‘Only my problems matter.’","Dismissal makes constructive resolution less likely.",false],["‘Then neither of us will ever talk again.’","An ultimatum is often disproportionate to this situation.",false]]},{"title":"The public insult","category":"Boundaries","setup":"During a group discussion, someone makes a personal insult after you disagree.","options":[["‘I'm happy to discuss the idea, not personal insults.’","Strong: respectful redirection defines an acceptable interaction.",true],["‘You're pathetic, and everyone knows it.’","Counterattacks escalate.",false],["‘I'll agree with anything so this ends.’","Pressure need not determine your position.",false]],"followup":"They say: ‘Can't you take a joke?’","nextOptions":[["‘I can take humor. Let's return to the topic without personal remarks.’","Strong: you avoid a debate about intention and return to conduct.",true],["‘You're clearly mentally ill.’","Diagnosing someone during a conflict is inappropriate.",false],["‘I'll embarrass you more than you embarrassed me.’","Revenge does not create a safer conversation.",false]]},{"title":"The urgent demand","category":"Pressure","setup":"Someone insists that you make a costly decision immediately or lose their approval.","options":[["‘I don't make expensive commitments under time pressure.’","Strong: slows the situation and protects informed choice.",true],["‘I'll pay now to prove loyalty.’","This accepts coercive pressure.",false],["‘I'll invent a crisis to make you stop.’","Deception is neither necessary nor constructive.",false]],"followup":"They say: ‘The opportunity will disappear!’","nextOptions":[["‘Then I may have to pass. I need enough information before deciding.’","Strong: you are willing to decline an unverifiable urgency claim.",true],["‘You win. I'll decide now.’","Pressure alone should not set the deadline.",false],["‘I'll threaten you unless you extend it.’","Threats worsen the situation.",false]]},{"title":"The uncertain memory","category":"Truth & Evidence","setup":"You and a friend remember an old conversation differently. Neither has a recording.","options":[["‘We may remember it differently. What can we actually verify?’","Strong: respects uncertainty and looks for evidence.",true],["‘My memory is always right.’","Human memory is fallible.",false],["‘You're gaslighting me, no question.’","One disagreement is insufficient to establish a pattern.",false]],"followup":"They reply: ‘There isn't any record. What now?’","nextOptions":[["‘Let's be clear about what each of us recalls and avoid claiming certainty.’","Strong: uncertainty is an honest outcome.",true],["‘Then I'll force you to admit my account is right.’","Coercion is not fact-finding.",false],["‘No record means you are guilty.’","Absence of a record does not establish a particular account.",false]]},{"title":"The shifting standard","category":"Accountability","setup":"Each time you meet an agreed request, the other person adds another requirement.","options":[["‘Can we write down the criteria we both agree to before continuing?’","Strong: documenting expectations helps test whether they are changing.",true],["‘You're evil for changing the conditions.’","Moral accusations are unlikely to clarify expectations.",false],["‘I'll secretly change the rules too.’","Retaliatory manipulation compounds confusion.",false]],"followup":"They say: ‘My needs have changed.’","nextOptions":[["‘That can happen. What changed, and what is a realistic new agreement?’","Strong: checks for legitimate changes without ignoring the pattern.",true],["‘Your needs are never allowed to change.’","Valid needs can evolve.",false],["‘Then I have to accept every new demand.’","You retain the right to negotiate or decline.",false]]},{"title":"The vague accusation","category":"Truth & Evidence","setup":"Someone says, ‘Everybody knows what you did,’ but provides no specific claim.","options":[["‘What exactly are you referring to? I want to respond to the specific concern.’","Strong: asks for an assessable claim.",true],["‘Whoever said that is lying.’","You have not yet heard the accusation.",false],["‘I'll find ways to get under your skin until you confess.’","Provocation does not reliably establish the truth.",false]],"followup":"They respond: ‘You know what I mean.’","nextOptions":[["‘I don't want to guess. If you can be specific, we can discuss it.’","Strong: refuses to argue with an undefined allegation.",true],["‘Then you're obviously a liar.’","That conclusion is unsupported.",false],["‘Fine, I admit everything.’","Do not agree to vague accusations simply to end tension.",false]]},{"title":"The apology with conditions","category":"Accountability","setup":"Someone apologizes for an insult, then says your reaction proves you deserved it.","options":[["‘I appreciate the apology. Can we discuss the insult without blaming my reaction for it?’","Strong: separates accountability from later disagreements.",true],["‘You're worthless at apologizing.’","Personal attacks undermine repair.",false],["‘I'll never let you apologize again.’","A sweeping punitive response may close off repair.",false]],"followup":"They reply: ‘But you upset me too.’","nextOptions":[["‘We can discuss both behaviors separately, and each take responsibility for our part.’","Strong: responsibility need not be a zero-sum contest.",true],["‘Only you ever do anything wrong.’","This rules out mutual accountability.",false],["‘Then your apology counts for nothing.’","The apology and any further accountability can be assessed separately.",false]]},{"title":"The silent treatment","category":"Boundaries","setup":"After a disagreement, someone stops communicating without explaining whether they need space.","options":[["‘I can respect space. Please let me know when we can return to the conversation.’","Strong: allows a pause without assuming motive.",true],["‘I'll message you a hundred times until you answer.’","Repeated unwanted contact violates boundaries.",false],["‘You're punishing me deliberately, and I know it.’","Silence alone cannot prove intent.",false]],"followup":"They reply later: ‘I wasn't ready to talk.’","nextOptions":[["‘Understood. Could we agree on a simple way to say we need a break next time?’","Strong: creates a workable communication agreement.",true],["‘You should never need a break.’","People may legitimately need time to regulate.",false],["‘Next time I'll ignore you for longer.’","Retaliation escalates conflict.",false]]},{"title":"The fake certainty","category":"Truth & Evidence","setup":"A person claims to know another individual's motives based only on a short social media post.","options":[["‘What evidence supports that interpretation? Could there be another explanation?’","Strong: encourages justified confidence and alternatives.",true],["‘That proves they have a personality disorder.’","You cannot diagnose someone from a post.",false],["‘Let's spread the claim to make them admit it.’","Public pressure and rumor are not ethical fact-finding.",false]],"followup":"They answer: ‘I can just tell what kind of person they are.’","nextOptions":[["‘That may be your impression, but let's separate impressions from confirmed facts.’","Strong: recognizes perception without treating it as verified.",true],["‘Your intuition makes you an expert.’","Confidence is not a substitute for evidence.",false],["‘Then let's expose their private information.’","Private information should not be weaponized.",false]]},{"title":"The work disagreement","category":"Influence","setup":"A colleague dismisses your proposal without explaining why.","options":[["‘Which part concerns you most? I'd like to understand the trade-offs.’","Strong: you seek useful criteria before persuading.",true],["‘You'll regret not supporting me.’","Threatening consequences is coercive.",false],["‘I'll flatter you until you agree.’","Manipulative praise does not address the decision.",false]],"followup":"They say: ‘I worry the plan will cost too much.’","nextOptions":[["‘Let's compare expected costs, benefits, and a smaller pilot option.’","Strong: shared evidence and alternatives support informed choice.",true],["‘You are too negative to understand.’","An insult sidesteps the concern.",false],["‘I'll hide the costs until after approval.’","Concealing material information is deceptive.",false]]}];
const guides=[{"title":"When they change the story","say":"‘I heard two different versions. Can you help me understand the timeline?’","why":"Clarifies a discrepancy without assuming deception."},{"title":"When they blame you for asking","say":"‘I'm asking about this specific issue. We can discuss other concerns afterward.’","why":"Returns the conversation to the topic."},{"title":"When they insult you","say":"‘I'll continue when we can speak without insults.’","why":"Sets a boundary under your control."},{"title":"When they demand an immediate answer","say":"‘I'm not making this decision under pressure. I'll respond after I've considered it.’","why":"Protects informed choice."},{"title":"When they deny your recollection","say":"‘We remember this differently. Let's check what can actually be verified.’","why":"Separates memory disputes from documented facts."},{"title":"When the conversation becomes circular","say":"‘We're repeating the same points. I'm going to pause this conversation.’","why":"Prevents an unproductive loop."},{"title":"When someone uses guilt","say":"‘I care about your feelings. I still need to choose what works for me.’","why":"Separates empathy from automatic compliance."},{"title":"When your boundary is ignored","say":"‘I've said no. If this continues, I'll leave this conversation.’","why":"States an action under your control."},{"title":"When someone mocks your concern","say":"‘This matters to me. If we can't discuss it respectfully, I'll pause.’","why":"Keeps the focus on respect."},{"title":"When a disagreement gets personal","say":"‘Can we focus on the decision rather than criticizing each other?’","why":"Redirects from identity attacks to the issue."},{"title":"When someone claims everyone agrees","say":"‘I'd like to discuss the facts directly rather than unnamed opinions.’","why":"Avoids pressure from unverifiable social consensus."},{"title":"When a new requirement appears","say":"‘Can we agree on clear expectations before I continue?’","why":"Clarifies changing standards."},{"title":"When you need to verify a claim","say":"‘What source supports that? Let's check it together.’","why":"Invites shared evidence."},{"title":"When an apology comes with blame","say":"‘I appreciate the apology. I also want to talk about the specific behavior.’","why":"Keeps accountability clear."},{"title":"When someone assumes your intentions","say":"‘I understand the impact. Can I explain what I intended?’","why":"Distinguishes intention from impact."},{"title":"When you need time","say":"‘I won't make this decision today. I'll revisit it after I've thought it through.’","why":"Reinforces the right to deliberate."},{"title":"When silence follows conflict","say":"‘I can respect a break. Let's agree when to check in again.’","why":"Respects space while seeking clarity."},{"title":"When you're being pressured publicly","say":"‘I'd rather talk about this privately when we're both ready.’","why":"Moves away from social pressure."},{"title":"When the conversation feels unsafe","say":"‘I'm ending this conversation now.’","why":"Prioritizes disengagement over winning."},{"title":"When you're asked for a confession","say":"‘I won't agree to something I don't believe happened. Let's review the evidence.’","why":"Prevents pressured false admissions."},{"title":"When you notice a pattern","say":"‘This has happened several times. I'd like to discuss one concrete example.’","why":"Uses specific examples instead of labels."}];
let page="home",caseIndex=0,answer=-1,query="",labStep=0,firstAnswer=-1,labCategory="All",patternQuery="",patternCategory="All";
const safeParse=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const storedJournal=safeParse("bia-journal-v1",[]);const journal=Array.isArray(storedJournal)?storedJournal:[];
const storedPractice=safeParse("bia-practice-v1",[]);const practice=Array.isArray(storedPractice)?storedPractice:[];
const escapeHTML=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("\u0027","&#39;");
const storedLessons=safeParse("bia-lessons-v1",[]);const completed=new Set(Array.isArray(storedLessons)?storedLessons:[]);

function saveLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
function menus(){for(const id of ["desktop-menu","mobile-menu"]){document.getElementById(id).innerHTML=nav.map(n=>'<button class="nav '+(page===n[0]?'active':'')+'" data-page="'+n[0]+'"><span class="symbol">'+n[1]+'</span>'+n[2]+'</button>').join('')}}
const viewHistory=[];
function goBack(){const previous=viewHistory.pop();if(previous){page=previous.page;window.currentLesson=previous.lesson;answer=-1;labStep=0;firstAnswer=-1;render();window.scrollTo({top:0,behavior:"auto"})}else if(page!=="home"){page="home";render();window.scrollTo({top:0,behavior:"auto"})}}
function openPage(next){viewHistory.push({page,lesson:window.currentLesson||0});page=next;answer=-1;labStep=0;firstAnswer=-1;render();window.scrollTo({top:0,behavior:"auto"});document.getElementById("mobile-menu").classList.add("hide");document.getElementById("menu-toggle").setAttribute("aria-expanded","false")}
function section(title,content){return '<section class="detail"><h1>'+title+'</h1>'+content+'</section>'}
function render(){menus();let out="";
if(page==="home"){out='<div class="hero"><div class="card hero-main"><div class="eyebrow">Behavioral intelligence</div><h1>Understand the pattern.<br>Choose your response.</h1><p class="lead">A practical guide to difficult personalities, manipulation recognition, evidence-based questioning, and confident communication.</p><button class="btn" data-page="practice">Start conversation practice →</button></div><div class="card hero-side"><div><div class="eyebrow">Your training progress</div><div class="number">'+completed.size+' / '+lessons.length+'</div><p>Short lessons completed · '+practice.length+' scenarios practiced</p></div><button class="btn secondary" data-page="learn">Continue learning →</button></div></div><h2 class="section-heading">Your workspace</h2><div class="grid">'+[['learn','◫','Short Lessons','Practical psychology in just a few minutes.'],['patterns','◇','Recognize Patterns','Spot manipulation tactics and understand their limitations.'],['practice','▤','Conversation Lab','Practice responses to realistic scenarios.'],['guide','☷','Quick Response Guide','Find calm, clear words for difficult moments.'],['journal','✎','Reflection Journal','Privately reflect on what you learned.']].map(n=>'<div class="card tile"><div class="ico">'+n[1]+'</div><h3>'+n[2]+'</h3><p>'+n[3]+'</p><button class="go" data-page="'+n[0]+'">Open →</button></div>').join('')+'</div>'}
if(page==="learn"){out=section("Short lessons",'<p class="lead">Learn the essential ideas without a college-style syllabus. Every lesson includes a takeaway and a quick exercise.</p><div class="list">'+lessons.map((l,i)=>'<div class="card lesson-card"><div><div class="mini">'+l.category+' · '+l.time+'</div><h3>'+l.title+'</h3><span class="pill">'+(completed.has(i)?"Completed":"Ready to learn")+'</span></div><button class="btn secondary" data-lesson="'+i+'">Open →</button></div>').join('')+'</div>')}
if(page==="lesson"){const i=window.currentLesson||0,l=lessons[i],ex=l.example;out=section(escapeHTML(l.title),'<div class="mini">'+escapeHTML(l.category)+' · '+escapeHTML(l.time)+'</div><div class="card article"><div class="lesson-intro">Start with a realistic conversation. Then explore the psychology, explanations, and practical responses in depth.</div><div class="case-example"><div class="mini">REALISTIC EXAMPLE</div><h2>'+escapeHTML(ex.scene)+'</h2><div class="dialogue">'+ex.dialogue.map(([speaker,words])=>'<div class="dialogue-line"><span class="dialogue-speaker">'+escapeHTML(speaker)+'</span><p>'+escapeHTML(words)+'</p></div>').join('')+'</div><h3>Why this example matters</h3><p>'+escapeHTML(ex.analysis)+'</p><h3>What could happen next</h3><p>'+escapeHTML(ex.options)+'</p></div><nav class="lesson-index" aria-label="More detail"><div class="mini">EXPLORE THE DETAILS</div>'+l.sections.map((x,n)=>'<a href="#lesson-section-'+n+'">'+(n+1)+'. '+escapeHTML(x[0])+'</a>').join('')+'</nav>'+l.sections.map((x,n)=>'<section class="deep-section" id="lesson-section-'+n+'"><h3>'+escapeHTML(x[0])+'</h3><p>'+escapeHTML(x[1])+'</p></section>').join('')+'<div class="actions"><button class="btn" data-complete="'+i+'">'+(completed.has(i)?"Completed ✓":"Mark lesson complete ✓")+'</button><button class="btn secondary" data-page="learn">All lessons</button></div></div>')}
if(page==="patterns"){const cats=["All",...new Set(patterns.map(x=>x.category))];const filtered=patterns.filter(x=>(patternCategory==="All"||x.category===patternCategory)&&(x.name+" "+x.sign+" "+x.example+" "+x.note+" "+x.depth.definition+" "+x.depth.mechanism).toLowerCase().includes(patternQuery.toLowerCase()));out=section("Behavioral Pattern Library",'<p class="lead">In-depth explanations and examples for every behavior. Select an entry to explore how it works, what it looks like, what can be misunderstood, and how to assess it.</p><div class="card"><label for="pattern-search"><strong>Search behaviors</strong></label><input id="pattern-search" class="search" placeholder="Try gaslighting, blame, boundaries..." value="'+escapeHTML(patternQuery)+'"><label for="pattern-category"><strong>Filter by area</strong></label><select id="pattern-category" class="search">'+cats.map(c=>'<option value="'+escapeHTML(c)+'" '+(patternCategory===c?'selected':'')+'>'+escapeHTML(c)+'</option>').join('')+'</select><div class="muted">'+filtered.length+' of '+patterns.length+' topics</div></div><div class="list" style="margin-top:14px">'+(filtered.length?filtered.map(x=>'<details class="card library-entry"><summary><span><span class="mini">'+escapeHTML(x.category)+'</span><span style="display:block">'+escapeHTML(x.name)+'</span></span></summary><div class="entry-body"><h3>What it means</h3><p>'+escapeHTML(x.depth.definition)+'</p><h3>Why it happens and how it works</h3><p>'+escapeHTML(x.depth.mechanism)+'</p><h3>Example 1</h3><p class="example-panel">'+escapeHTML(x.example)+'</p><h3>Example 2</h3><p class="example-panel">'+escapeHTML(x.depth.secondExample)+'</p><h3>What is different or easily confused</h3><p>'+escapeHTML(x.depth.comparison)+'</p><h3>How to evaluate the situation</h3><p>'+escapeHTML(x.depth.evaluation)+'</p><h3>Example response</h3><p class="response">'+escapeHTML(x.response)+'</p><h3>Practical next step</h3><p>'+escapeHTML(x.next)+'</p></div></details>').join(''):'<div class="card">No matching entries. Try another term.</div>')+'</div>')}
if(page==="practice"){const c=cases[caseIndex],opts=labStep===0?c.options:c.nextOptions,stageText=labStep===0?c.setup:c.followup;const categories=["All",...new Set(cases.map(x=>x.category))];out=section("Conversation Lab",'<p class="lead">Twelve two-stage simulations. Choose a response and consider the other person\'s reaction. Feedback teaches evidence, boundaries, and ethical influence—not tricks to force confessions.</p><div class="card"><label for="lab-filter"><strong>Choose a skill</strong></label><select class="search" id="lab-filter">'+categories.map(cat=>'<option value="'+escapeHTML(cat)+'" '+(cat===labCategory?'selected':'')+'>'+escapeHTML(cat)+'</option>').join('')+'</select><div class="mini">Scenario '+(caseIndex+1)+' of '+cases.length+' · '+escapeHTML(c.category)+' · Round '+(labStep+1)+' of 2</div><h2>'+escapeHTML(c.title)+'</h2><p>'+escapeHTML(stageText)+'</p><h3>How would you respond?</h3>'+opts.map((o,i)=>'<button class="option '+(answer===i?"chosen":"")+'" data-answer="'+i+'">'+escapeHTML(o[0])+'</button>').join('')+(answer>=0?'<div class="feedback"><strong>'+(opts[answer][2]?"Effective approach":"Learning opportunity")+'</strong><p>'+escapeHTML(opts[answer][1])+'</p></div>':'')+'<div class="actions">'+(labStep===0?'<button class="btn" data-labcontinue="1" '+(answer<0?'disabled':'')+'>See what happens next →</button>':'<button class="btn" data-nextcase="1" '+(answer<0?'disabled':'')+'>Finish and try next scenario →</button>')+'<button class="btn secondary" data-labreset="1">Start this scenario again</button></div></div><p class="muted" style="margin-top:13px">'+practice.length+' completed sessions saved on this device.</p>')}
if(page==="journal"){out=section("Reflection Journal",'<p class="lead">Reflect on fictional practice scenarios or your own reactions. Notes are stored only in this browser on this device. Avoid adding sensitive information about anyone.</p><div class="card"><label for="journal-entry"><strong>What did you learn or want to practice?</strong></label><textarea id="journal-entry" class="search" rows="5" maxlength="1500" placeholder="Example: Next time I want to ask one neutral question before reacting."></textarea><button class="btn" data-savejournal="1">Save reflection</button></div><div class="section-heading"><h2>Saved reflections</h2><p class="muted">'+journal.length+' entries on this device</p></div><div class="list">'+(journal.length?journal.map((j,i)=>'<div class="card"><div class="mini">'+escapeHTML(j.date)+'</div><p style="white-space:pre-wrap">'+escapeHTML(j.text)+'</p><button class="btn secondary" data-deletejournal="'+i+'">Delete entry</button></div>').join(''):'<div class="card">No reflections saved yet.</div>')+'</div>')}
if(page==="guide"){const filtered=guides.filter(x=>(x.title+" "+x.say+" "+x.why).toLowerCase().includes(query.toLowerCase()));out=section("Quick Response Guide",'<p class="lead">Find respectful, firm responses you can adapt to your own words. These are starting points, not scripts guaranteed to change another person.</p><input class="search" id="guide-search" aria-label="Search responses" placeholder="Search a situation (e.g. blame, pressure, insults)" value="'+query.replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")+'"><div class="list">'+(filtered.length?filtered.map((g,i)=>'<div class="card"><h3>'+g.title+'</h3><p class="response">'+g.say+'</p><p class="muted">'+g.why+'</p><button class="btn secondary" data-copy="'+guides.indexOf(g)+'">Copy response</button></div>').join(''):'<div class="card">No matching responses. Try a different search.</div>')+'</div>')}
document.getElementById("view").innerHTML=out+'<div class="notice">Educational information, not clinical diagnosis, therapy, lie detection, or a substitute for safety planning. If someone is threatening or abusive, prioritize your safety and outside support.</div>'}
document.body.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.back){goBack();return}if(b.dataset.page)openPage(b.dataset.page);if(b.dataset.lesson!==undefined){window.currentLesson=+b.dataset.lesson;openPage("lesson")}if(b.dataset.complete!==undefined){completed.add(+b.dataset.complete);saveLocal("bia-lessons-v1",[...completed]);render()}if(b.dataset.answer!==undefined){answer=+b.dataset.answer;render()}if(b.dataset.labcontinue&&answer>=0){firstAnswer=answer;labStep=1;answer=-1;render()}if(b.dataset.labreset){labStep=0;answer=-1;firstAnswer=-1;render()}if(b.dataset.nextcase&&answer>=0){practice.push({caseIndex,firstAnswer,answer,date:new Date().toISOString()});saveLocal("bia-practice-v1",practice);let next=(caseIndex+1)%cases.length;if(labCategory!=="All"){for(let i=0;i<cases.length;i++){const candidate=(caseIndex+1+i)%cases.length;if(cases[candidate].category===labCategory){next=candidate;break}}}caseIndex=next;answer=-1;firstAnswer=-1;labStep=0;render()}if(b.dataset.savejournal){const v=document.getElementById("journal-entry")?.value.trim();if(v){journal.unshift({text:v.slice(0,1500),date:new Date().toLocaleDateString()});saveLocal("bia-journal-v1",journal);render()}}if(b.dataset.deletejournal!==undefined){journal.splice(+b.dataset.deletejournal,1);saveLocal("bia-journal-v1",journal);render()}if(b.dataset.copy!==undefined){const t=guides[+b.dataset.copy].say;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>{b.textContent="Copied ✓"},()=>{b.textContent="Select and copy the response above"})}else{b.textContent="Select and copy the response above"}}});
document.body.addEventListener("change",e=>{if(e.target.id==="pattern-category"){patternCategory=e.target.value;render()}if(e.target.id==="lab-filter"){labCategory=e.target.value;caseIndex=labCategory==="All"?0:cases.findIndex(c=>c.category===labCategory);labStep=0;firstAnswer=-1;answer=-1;render()}});
document.body.addEventListener("input",e=>{if(e.target.id==="pattern-search"){const pos=e.target.selectionStart;patternQuery=e.target.value;render();const i=document.getElementById("pattern-search");i.focus();i.setSelectionRange(pos,pos)}if(e.target.id==="guide-search"){const pos=e.target.selectionStart;query=e.target.value;render();const i=document.getElementById("guide-search");i.focus();i.setSelectionRange(pos,pos)}});
document.getElementById("menu-toggle").addEventListener("click",e=>{const m=document.getElementById("mobile-menu"),opened=m.classList.toggle("hide")===false;e.currentTarget.setAttribute("aria-expanded",String(opened))});
render();
</script>
