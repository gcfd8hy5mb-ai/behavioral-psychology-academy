cle{font-size:15px;line-height:1.8}.article h3{margin-top:18px}.article ul{padding-left:22px}.article li{margin-bottom:8px}.response{border-left:4px solid var(--accent);padding:12px 15px;background:#F0E7F4;border-radius:0 10px 10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.example-panel{background:#F0E7F4;border-left:3px solid var(--accent);padding:15px 17px;border-radius:0 9px 9px 0;white-space:pre-line}.entry-body h3{margin:20px 0 9px}.entry-body p{line-height:1.75}.library-entry summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:750;font-size:17px}.library-entry summary::-webkit-details-marker{display:none}.library-entry summary::after{content:"+";font-size:23px;color:var(--accent)}.library-entry[open] summary::after{content:"−"}.library-entry .entry-body{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}.library-entry .mini{margin-bottom:7px}.search{display:block;width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--ink);margin:20px 0}.case-example{border:1px solid var(--border);border-radius:16px;background:#F6EEF9;padding:18px;margin-bottom:20px}.case-example h2{font-size:21px;margin:7px 0 18px}.dialogue{display:grid;gap:10px;margin-bottom:22px}.dialogue-line{max-width:94%;background:#fff;border:1px solid #E2D4E9;border-radius:12px;padding:12px 15px}.dialogue-line:nth-child(even){margin-left:auto;background:#E9DCEF}.dialogue-line p{margin:4px 0 0}.dialogue-speaker{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-dark)}.page-controls{display:flex;align-items:center;gap:15px;margin:-18px 0 23px}.back-button{padding:8px 13px;font-size:13px}.page-location{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:750}@media(max-width:850px){.page-controls{margin:0 0 20px}}.lesson-intro{background:#EFE3F4;padding:15px 18px;border-radius:12px;margin-bottom:18px;font-weight:650}.lesson-index{display:grid;gap:8px;background:#F0E8F4;border-radius:12px;padding:14px 18px;margin:15px 0 24px}.lesson-index a{color:var(--accent-dark);text-decoration:none;font-size:14px;font-weight:650}.deep-section{padding:20px 0;border-bottom:1px solid var(--border);scroll-margin-top:95px}.deep-section h3{font-size:19px;margin:7px 0 12px}.deep-section p{font-size:16px;line-height:1.85}.deep-section:last-of-type{border:0}textarea.search{resize:vertical;min-height:120px} .btn:disabled{opacity:.48;cursor:not-allowed}.option{display:block;text-align:left;width:100%;border:1px solid var(--border);border-radius:12px;padding:15px;background:#fff;color:var(--ink);margin-top:11px}.option:hover{border-color:var(--accent)}.option.chosen{border:2px solid var(--accent);background:#F0E7F4}.feedback{background:#E9DDEE;border-radius:13px;padding:17px;margin-top:17px}.mobile-head{display:none}.notice{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px;margin-top:25px}@media(max-width:850px){.app{display:block}aside{display:none}.mobile-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;z-index:5;top:0;background:#F3ECF7;padding:12px 18px;border-bottom:1px solid var(--border)}.mobile-head .brand{padding:0}.mobile-head .brand-mark{width:35px;height:35px}.mobile-head .brand-name{font-size:11px}.mobile-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:10px 15px;background:#F3ECF7;border-bottom:1px solid var(--border)}.mobile-menu .nav{font-size:12px;padding:9px}main{padding:22px 18px 50px}.top{margin-bottom:20px}.hero{grid-template-columns:1fr}.hero-main{padding:25px}.hero-side{min-height:125px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px}.tile{min-height:185px}.tile .ico{width:38px;height:38px}.lesson-card{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.tile{min-height:142px}.top .tag{display
